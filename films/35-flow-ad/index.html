</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
// 35-flow-ad — «ব্র্যান্ডে জ্যাম? Flow করান।» A 60 s vertical motion-graphics ad for Flow Communications.
// Grammar from the client's sample: a black stage, glowing neon cards that stack and shuffle, glossy chibi characters,
// dashboards and counters, a glowing logo end card with chevrons. Palette from the Flow logo: crimson + gold on black.
// Every hit lands on the voice-over's word (times from the cleaned VO, assets/vo.wav).
const W = 1080, H = 1920, FPS = 30, DUR = 61.0, D = '/demos/35-flow-ad/';
window.DEMO = { width: W, height: H, fps: FPS, duration: DUR };
const cv = document.getElementById('c'), X = cv.getContext('2d');
const ENV = await (await fetch(D + 'env.json')).json();
const loadImg = s => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(s); i.src = s; });
const LOGO = await loadImg(D + 'assets/logo.png');
for (const f of ['700 60px Hind', '500 60px Hind', '800 60px Mont', '600 60px Mont']) await document.fonts.load(f, 'ব্র্যান্ড জ্যাম Flow ০১২৩৪৫৬৭৮৯ abc');
await document.fonts.ready;

// ---------------------------------------------------------------- palette + helpers
const RED = '#C21D24', REDL = '#FF3B3B', GOLD = '#E3B341', GOLDL = '#FFD86B', GOLDD = '#9C7424', INK = '#07060A', CARD = '#120E10', WHITE = '#F7F1E6', MUTE = '#9C928A';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - clamp(x), 3), eIO = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eBack = x => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const pop = (t, at, d = .35) => t < at ? 0 : eBack((t - at) / d);
const hash = (a, b = 0) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
const BN = n => String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
const envAt = t => ENV.env[clamp(Math.floor(t * ENV.fps), 0, ENV.env.length - 1)] || 0;
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function glow(c, col, b) { c.shadowColor = col; c.shadowBlur = b; }
function noGlow(c) { c.shadowBlur = 0; c.shadowColor = 'transparent'; }
function text(c, s, x, y, o = {}) {
  const { size = 60, col = WHITE, w = 700, font = 'Hind', align = 'center', base = 'middle', g = 0, gc = col, a = 1, maxW } = o;
  c.save(); c.globalAlpha *= a; c.font = `${w} ${size}px ${font}`; c.textAlign = align; c.textBaseline = base; c.fillStyle = col;
  if (g) glow(c, gc, g); c.fillText(s, x, y, maxW); c.restore();
}
// a neon card: dark glass body, gradient rim with glow; stack: ghost cards peeking above (like the sample)
function card(c, x, y, w, h, o = {}) {
  const { c1 = GOLD, c2 = RED, r = 34, stack = 0, a = 1, lw = 4 } = o;
  c.save(); c.globalAlpha *= a;
  for (let i = stack; i >= 1; i--) { const k = i * 22; rr(c, x + k, y - k * 1.1, w - 2 * k, h, r); c.fillStyle = CARD; c.fill(); c.lineWidth = 3; c.strokeStyle = i % 2 ? c2 : c1; c.globalAlpha = a * (.55 - i * .12); c.stroke(); c.globalAlpha = a; }
  rr(c, x, y, w, h, r); const bg = c.createLinearGradient(0, y, 0, y + h); bg.addColorStop(0, '#1A1316'); bg.addColorStop(1, '#0C090B'); c.fillStyle = bg; c.fill();
  const gr = c.createLinearGradient(x, y, x + w, y + h); gr.addColorStop(0, c1); gr.addColorStop(1, c2);
  glow(c, c1, 34); c.lineWidth = lw; c.strokeStyle = gr; c.stroke(); noGlow(c);
  c.restore();
}
// ---------------------------------------------------------------- icons (simple vector)
function icon(c, kind, x, y, s, col = GOLD) {
  c.save(); c.translate(x, y); c.scale(s, s); c.strokeStyle = col; c.fillStyle = col; c.lineWidth = 6; c.lineCap = 'round'; c.lineJoin = 'round'; glow(c, col, 18);
  if (kind === 'like') { rr(c, -34, -4, 18, 40, 5); c.fill(); c.beginPath(); c.moveTo(-12, 36); c.lineTo(22, 36); c.quadraticCurveTo(36, 34, 36, 20); c.lineTo(36, 4); c.quadraticCurveTo(36, -6, 24, -6); c.lineTo(6, -6); c.lineTo(10, -28); c.quadraticCurveTo(10, -40, 0, -40); c.lineTo(-12, -4); c.closePath(); c.fill(); }
  else if (kind === 'globe') { c.beginPath(); c.arc(0, 0, 36, 0, 7); c.stroke(); c.beginPath(); c.ellipse(0, 0, 15, 36, 0, 0, 7); c.stroke(); c.beginPath(); c.moveTo(-36, 0); c.lineTo(36, 0); c.moveTo(-30, -18); c.lineTo(30, -18); c.moveTo(-30, 18); c.lineTo(30, 18); c.stroke(); }
  else if (kind === 'play') { rr(c, -40, -30, 80, 60, 14); c.stroke(); c.beginPath(); c.moveTo(-10, -14); c.lineTo(16, 0); c.lineTo(-10, 14); c.closePath(); c.fill(); }
  else if (kind === 'social') { rr(c, -34, -34, 68, 68, 18); c.stroke(); c.beginPath(); c.arc(0, 0, 15, 0, 7); c.stroke(); c.beginPath(); c.arc(21, -21, 4, 0, 7); c.fill(); }
  else if (kind === 'star') { c.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 16 : 38; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); } c.closePath(); c.fill(); }
  else if (kind === 'brush') { c.beginPath(); c.moveTo(-30, 30); c.quadraticCurveTo(-34, 6, -14, 10); c.lineTo(28, -32); c.lineTo(34, -26); c.lineTo(-8, 16); c.quadraticCurveTo(-4, 36, -30, 30); c.fill(); }
  else if (kind === 'cart') { c.beginPath(); c.moveTo(-40, -28); c.lineTo(-26, -28); c.lineTo(-14, 16); c.lineTo(28, 16); c.lineTo(36, -14); c.lineTo(-20, -14); c.stroke(); c.beginPath(); c.arc(-8, 30, 6, 0, 7); c.arc(22, 30, 6, 0, 7); c.fill(); }
  else if (kind === 'heart') { c.beginPath(); c.moveTo(0, 30); c.bezierCurveTo(-46, 0, -26, -40, 0, -16); c.bezierCurveTo(26, -40, 46, 0, 0, 30); c.fill(); }
  else if (kind === 'user') { c.beginPath(); c.arc(0, -14, 16, 0, 7); c.fill(); c.beginPath(); c.arc(0, 36, 30, Math.PI, 0); c.fill(); }
  c.restore();
}
// ---------------------------------------------------------------- glossy chibi characters (the sample's glowing figure, in our colours)
const shade = (hex, k) => { const n = parseInt(hex.slice(1), 16), f = v => clamp(Math.round(v * k), 0, 255); return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`; };
function chibi(c, x, y, s, o = {}) {
  const { col = '#3A6BFF', look = [0, 0], mouth = 0, blink = false, armL = .4, armR = -.4, acc = [], rim = GOLD, tilt = 0, sad = 0, a = 1 } = o;
  c.save(); c.globalAlpha *= a; c.translate(x, y); c.scale(s, s); c.rotate(tilt);
  const gloss = (cx, cy, r) => { const g = c.createRadialGradient(cx - r * .35, cy - r * .45, r * .1, cx, cy, r * 1.05); g.addColorStop(0, shade(col, 1.9)); g.addColorStop(.45, col); g.addColorStop(1, shade(col, .35)); return g; };
  // body
  glow(c, rim, 30);
  const arm = (side, ang) => { c.save(); c.translate(side * 52, -120); c.rotate(ang * side); rr(c, -14, 0, 28, 92, 14); c.fillStyle = gloss(0, 40, 50); c.fill(); c.restore(); };
  arm(-1, armL); arm(1, -armR);
  rr(c, -62, -150, 124, 150, 58); c.fillStyle = gloss(0, -75, 85); c.fill();
  // head
  c.beginPath(); c.arc(0, -232, 92, 0, 7); c.fillStyle = gloss(0, -232, 92); c.fill(); noGlow(c);
  // face
  for (const sd of [-1, 1]) {
    const ex = sd * 32 + look[0] * 8, ey = -238 + look[1] * 6;
    if (blink) { c.strokeStyle = '#0A0A14'; c.lineWidth = 6; c.beginPath(); c.moveTo(ex - 13, ey); c.lineTo(ex + 13, ey); c.stroke(); }
    else { c.fillStyle = '#FFFFFF'; c.beginPath(); c.ellipse(ex, ey, 17, 21, 0, 0, 7); c.fill(); c.fillStyle = '#0A0A14'; c.beginPath(); c.ellipse(ex + look[0] * 5, ey + 2 + look[1] * 5, 9, 11, 0, 0, 7); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(ex + look[0] * 5 - 3, ey - 3, 3.5, 0, 7); c.fill(); }
    if (sad) { c.strokeStyle = '#0A0A14'; c.lineWidth = 5; c.beginPath(); c.moveTo(ex - 16 * sd, ey - 34 + sad * 6 * sd * sd); c.lineTo(ex + 14 * sd, ey - 30 - sad * 8); c.stroke(); }
  }
  c.fillStyle = '#2A0810'; c.beginPath(); c.ellipse(0, -186, 16 - mouth * 3, 4 + mouth * 15, 0, 0, 7); c.fill();
  // accessories
  for (const k of acc) {
    if (k === 'tupi') { c.fillStyle = '#F4F0E6'; c.beginPath(); c.ellipse(0, -300, 74, 34, 0, Math.PI, 0); c.fill(); rr(c, -74, -304, 148, 20, 8); c.fill(); }
    if (k === 'stache') { c.fillStyle = '#1A0E0A'; c.beginPath(); c.ellipse(-16, -200, 22, 8, -.25, 0, 7); c.ellipse(16, -200, 22, 8, .25, 0, 7); c.fill(); }
    if (k === 'shades') { c.fillStyle = '#050505'; rr(c, -60, -256, 52, 32, 10); c.fill(); rr(c, 8, -256, 52, 32, 10); c.fill(); c.fillRect(-10, -246, 20, 6); c.fillStyle = 'rgba(255,255,255,.4)'; c.fillRect(-52, -250, 16, 5); c.fillRect(16, -250, 16, 5); }
    if (k === 'hijab') { c.fillStyle = '#7A1E3A'; c.beginPath(); c.arc(0, -236, 104, Math.PI * .95, Math.PI * 2.05); c.lineTo(84, -150); c.lineTo(-84, -150); c.closePath(); c.fill(); c.fillStyle = gloss(0, -232, 92); c.beginPath(); c.ellipse(0, -222, 70, 78, 0, 0, 7); c.fill(); }
    if (k === 'headset') { c.strokeStyle = RED; c.lineWidth = 12; c.beginPath(); c.arc(0, -236, 98, Math.PI * 1.08, Math.PI * 1.92); c.stroke(); c.fillStyle = RED; rr(c, -112, -258, 26, 52, 10); c.fill(); rr(c, 86, -258, 26, 52, 10); c.fill(); c.lineWidth = 6; c.beginPath(); c.moveTo(-100, -210); c.quadraticCurveTo(-90, -170, -40, -176); c.stroke(); }
    if (k === 'cap') { c.fillStyle = '#12B5A8'; c.beginPath(); c.arc(0, -262, 84, Math.PI, 0); c.fill(); rr(c, -10, -270, 120, 20, 10); c.fill(); }
    if (k === 'mega') { c.save(); c.translate(96, -200); c.rotate(-.35); c.fillStyle = '#F2F2F2'; glow(c, GOLD, 16); c.beginPath(); c.moveTo(0, -18); c.lineTo(110, -56); c.lineTo(110, 56); c.lineTo(0, 18); c.closePath(); c.fill(); c.fillStyle = RED; rr(c, -26, -22, 30, 44, 8); c.fill(); c.restore(); }
  }
  c.restore();
}
const blinkAt = (t, p = 3.1, o = 0) => ((t + o) % p) < .1;

// ---------------------------------------------------------------- the stage: black with faint moving dots and a slow red/gold breath of light
function stage(c, t, o = {}) {
  c.fillStyle = INK; c.fillRect(0, 0, W, H);
  const g = c.createRadialGradient(W * .5, H * .42, 50, W * .5, H * .42, H * .75); g.addColorStop(0, o.warm ? 'rgba(120,30,30,.35)' : 'rgba(70,20,26,.28)'); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.fillStyle = 'rgba(227,179,65,.12)';
  for (let i = 0; i < 70; i++) { const x = (hash(i, 1) * W + t * 10 * (hash(i, 2) - .5)) % W, y = (hash(i, 3) * H - t * 14 * hash(i, 4) + H * 10) % H; c.beginPath(); c.arc(x, y, 1.5 + hash(i, 5) * 2, 0, 7); c.fill(); }
}

// ---------------------------------------------------------------- captions: each phrase pops word by word on its sung time
const P = [
  [2.02, 3.54, 'ঢাকার জ্যাম তো চেনেন।', ['জ্যাম']], [3.90, 6.40, 'কিন্তু ব্র্যান্ডের জ্যাম চেনেন?', ['ব্র্যান্ডের', 'জ্যাম']],
  [6.46, 7.47, 'পেজে লাইক তিনটা।', ['তিনটা।']], [8.02, 8.66, 'একটা আম্মুর,', ['আম্মুর,']], [9.06, 9.69, 'একটা খালার…', ['খালার…']],
  [10.32, 12.48, 'আর একটা রহিম ভাইয়ের নিজেরই সেকেন্ড আইডি।', ['সেকেন্ড', 'আইডি।']],
  [13.17, 15.11, 'রহিম ভাই ৫০০ টাকা বুস্ট দিলেন।', ['৫০০', 'টাকা']], [15.72, 16.30, 'লাইক আসলো।', ['লাইক']],
  [16.82, 17.34, 'কাস্টমার?', ['কাস্টমার?']], [17.86, 18.61, 'একটাও না।', ['না।']],
  [19.66, 21.0, 'ভাইসব, ভাইসব!', ['ভাইসব!']], [21.0, 23.04, 'আপনার ব্র্যান্ডে জ্যাম? পেজে লাইক নাই?', ['জ্যাম?']],
  [23.40, 25.06, 'একটা দাওয়াই আছে, মাত্র—', ['দাওয়াই']],
  [25.91, 28.33, 'মামা, এইটা মলমে সারে না।', ['মলমে']], [28.69, 30.08, 'এইটার জন্য টিম লাগে।', ['টিম']],
  [35.68, 38.40, 'মানে… যেখানে জ্যাম, সেখানেই Flow।', ['Flow।']],
  [43.95, 45.85, 'দুনিয়ার যেকোনো জায়গা থেকে কাজ করে…', ['দুনিয়ার']], [46.08, 47.93, 'আর জ্যাম ছুটিয়ে দেয়।', ['ছুটিয়ে']],
  [53.12, 55.43, 'আগে জানলে ভাগ্নেরে দিয়া লোগো করাইতাম না।', ['লোগো']], [56.10, 58.10, 'মামা, আমি তো ফ্রি তে করছিলাম…', ['ফ্রি'], 'whisper'],
];
function caption(c, t) {
  const p = P.find(q => t >= q[0] - .05 && t < Math.min(q[1] + .55, (P[P.indexOf(q) + 1]?.[0] ?? 99) - .05)); if (!p) return;
  const [t0, t1, s, hot, mode] = p, words = s.split(' '), whisper = mode === 'whisper';
  const size = whisper ? 54 : 72, y0 = 1560, maxW = 960;
  c.save(); c.font = `700 ${size}px Hind`;
  // wrap into lines
  const lines = [[]]; let lw = 0; const sp = size * .3;
  for (const wd of words) { const ww = c.measureText(wd).width; if (lw + ww > maxW && lines[lines.length - 1].length) { lines.push([]); lw = 0; } lines[lines.length - 1].push([wd, ww]); lw += ww + sp; }
  const tot = words.reduce((a, w) => a + w.length, 0); let acc = 0;
  const out = clamp((t - (t1 + .3)) / .25);
  lines.forEach((ln, li) => {
    const lwid = ln.reduce((a, [, ww]) => a + ww, 0) + sp * (ln.length - 1); let x = W / 2 - lwid / 2;
    const y = y0 + li * size * 1.25 - (lines.length - 1) * size * .6;
    for (const [wd, ww] of ln) {
      const at = t0 + (acc / tot) * (t1 - t0) * .85; acc += wd.length;
      const k = pop(t, at, .28);
      if (k > 0) {
        const isHot = hot.includes(wd);

        if (whisper) { c.font = `500 ${size}px Hind`; c.fillStyle = 'rgba(247,241,230,.75)'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(wd, 0, 0); }
        else {
          c.font = `700 ${size}px Hind`; c.textAlign = 'center'; c.textBaseline = 'middle';
          c.lineWidth = 12; c.strokeStyle = 'rgba(0,0,0,.85)'; c.lineJoin = 'round'; c.strokeText(wd, 0, 0);
          if (isHot) glow(c, GOLD, 26); c.fillStyle = isHot ? GOLDL : WHITE; c.fillText(wd, 0, 0);
        }
        c.restore();
      }
      x += ww + sp;
    }
  });
  c.restore();
}

// ---------------------------------------------------------------- scenes
const SC = [];
const scene = (t0, fn) => SC.push({ t0, fn });
// 1 · the Dhaka jam → the brand jam
function vehicle(c, x, y, s, kind, t, i, brand) {
  c.save(); c.translate(x + Math.sin(t * 9 + i) * 1.5, y); c.scale(s, s);
  const body = ['#7A1B22', '#2B2E3A', '#8C6A20', '#3A1420'][i % 4];
  if (kind === 'bus') { rr(c, -150, -120, 300, 120, 18); c.fillStyle = body; c.fill(); for (let k = 0; k < 4; k++) { rr(c, -130 + k * 68, -100, 52, 40, 6); c.fillStyle = '#1B1F2A'; c.fill(); } }
  else if (kind === 'rick') { c.beginPath(); c.arc(-40, -60, 60, Math.PI, 0); c.fillStyle = RED; c.fill(); rr(c, -100, -60, 120, 50, 10); c.fillStyle = '#3B2A1A'; c.fill(); c.strokeStyle = GOLD; c.lineWidth = 5; c.beginPath(); c.moveTo(20, -30); c.lineTo(80, -30); c.lineTo(90, -80); c.stroke(); }
  else { rr(c, -110, -70, 220, 70, 22); c.fillStyle = body; c.fill(); rr(c, -70, -110, 130, 48, 16); c.fill(); c.fillStyle = '#151820'; rr(c, -58, -102, 50, 34, 8); c.fill(); rr(c, 0, -102, 50, 34, 8); c.fill(); }
  // lights: gold head, red tail, glowing
  glow(c, GOLD, 24); c.fillStyle = GOLDL; c.beginPath(); c.arc(kind === 'bus' ? 146 : 104, -30, 9, 0, 7); c.fill();
  glow(c, REDL, 24); c.fillStyle = REDL; c.beginPath(); c.arc(kind === 'bus' ? -146 : -104, -30, 8, 0, 7); c.fill(); noGlow(c);
  for (const wx of kind === 'bus' ? [-90, 90] : kind === 'rick' ? [-60, 60] : [-62, 62]) { c.fillStyle = '#0A0A0A'; c.beginPath(); c.arc(wx, 0, 22, 0, 7); c.fill(); c.strokeStyle = '#555'; c.lineWidth = 4; c.stroke(); }
  if (brand) { c.fillStyle = 'rgba(0,0,0,.55)'; rr(c, -44, kind === 'bus' ? -110 : -150, 88, 88, 22); c.fill(); icon(c, brand, 0, kind === 'bus' ? -66 : -106, .9, i % 2 ? GOLD : REDL); }
  c.restore();
}
scene(0, (c, t) => {
  stage(c, t);
  const brandT = 3.9, b = t > brandT;
  // three lanes of a jammed road, the camera slowly pushing in
  const z = 1 + t * .02; c.save(); c.translate(W / 2, 980); c.scale(z, z); c.translate(-W / 2, -980);
  for (let l = 0; l < 3; l++) { const y = 700 + l * 260; c.strokeStyle = 'rgba(227,179,65,.25)'; c.lineWidth = 4; c.setLineDash([40, 30]); c.beginPath(); c.moveTo(0, y + 40); c.lineTo(W, y + 40); c.stroke(); c.setLineDash([]); }

// ---------------------------------------------------------------- compositor: scenes cross with a short glow-zoom
const A = document.createElement('canvas'); A.width = W; A.height = H; const AX = A.getContext('2d');
