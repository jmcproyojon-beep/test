<script type="module">
// 30-manobotar-dak — 「মানবতার ডাক」 Humanity's Call. Collage / cut-out lyric film, 1920x1080, 30 fps, length = the song.
// Canvas2D; every frame is a pure function of t. Motion is quantised to 12 fps (resting pieces boil at 6 fps) with seeded
// ±2 px hand-placement jitter. Pieces are CC0/PD cutouts with baked halftone + scissor-cut white rims (work/prep.py).
const W = 1920, H = 1080, D = '/demos/30-manobotar-dak/', D6 = '/demos/06-collage/';
const C = await (await fetch(D + 'cues.json')).json();
const A = await (await fetch(D + 'cues_audio.json')).json();
const DUR = A.duration;
window.DEMO = { width: W, height: H, fps: 30, duration: DUR };
const cv = document.getElementById('c'), X = cv.getContext('2d');
const LAY = await (await fetch(D + 'assets/gen/layout.json')).json();
const LAY6 = await (await fetch(D6 + 'assets/gen/layout.json')).json();
const load = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(src); i.src = src; });
const I = {};
const GEN = ['boy', 'girl', 'man', 'mother', 'king', 'flowers', 'bird_b', 'earth', 'sun', 'goya_a', 'goya_b', 'goya_c', 'goya_d',
  'globe', 'court', 'map_a', 'map_b', 'ruins', 'aircraft', 'children'];
const GEN6 = ['p_lid', 'p_jaw', 'p_face', 'space_wedge', 'bird_hawk', 'rose_purple', 'rose_centi', 'bfly_a', 'bfly_b',
  'rocket', 'flame0', 'flame1', 'news_a', 'news_b', 'manicule'];
// hero (the singer): if assets/gen/hero_*.png exist they replace the stand-in portrait (same piece layout contract)
const HERO = LAY.hero_face ? 'hero' : null;
await Promise.all([
  ...GEN.map(async n => I[n] = await load(D + 'assets/gen/' + n + '.png')),
  ...GEN6.map(async n => I[n] = await load(D6 + 'assets/gen/' + n + '.png')),
  ...(HERO ? ['hero_face', 'hero_lid', 'hero_jaw', 'hero_cavity', 'hero_body', 'hero_profile', 'hero_back'].filter(n => LAY[n]).map(async n => I[n] = await load(D + 'assets/gen/' + n + '.png')) : []),
  (async () => I.kraft = await load(D6 + 'assets/gen/page_kraft.jpg'))(),
  (async () => I.red = await load(D6 + 'assets/gen/page_red.jpg'))(),
  (async () => I.grain = await load('/assets/textures/grain/grain_film35_2048.png'))(),
  (async () => I.dust1 = await load('/assets/textures/dust/dust_01_3840x2160.png'))(),
  (async () => I.dust2 = await load('/assets/textures/dust/dust_03_3840x2160.png'))(),
  (async () => I.paper = await load('/assets/textures/paper/Paper001_4K_color.jpg'))(),
  (async () => I.tapeW = await load('/assets/textures/washi/washi_solid_14.png'))(),
  (async () => I.tapeK = await load('/assets/textures/washi/washi_solid_12.png'))(),
]);
await Promise.all(Object.values(I).map(i => i.decode()));
const BN = '"Anek Bangla"';
for (const f of [`800 100px ${BN}`, `600 100px ${BN}`, `500 30px "IBM Plex Mono"`, `400 100px "Anton"`])
  await document.fonts.load(f, 'মানবতার ডাক শেষ আলো জ্বলবেই যুদ্ধ নয় শান্তি চাই ঘৃণা ভালোবাসা ক্ষমতা মানুষ বাঁচুক ০১২৩৪৫৬৭৮৯ — ? ! । ABC');
await document.fonts.ready;

// ------------------------------------------------------------------ helpers
const PI = Math.PI, DEG = PI / 180;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const eOut = x => 1 - Math.pow(1 - clamp(x), 3);
const eIO = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eBack = x => { x = clamp(x); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function hash(a, b = 0) { let h = (Math.round(a * 1000) * 374761393 + b * 668265263 + 1013904223) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
const K = t => Math.floor(t * 12 + 1e-4);              // 12 fps step index
const Q = t => K(t) / 12;                               // quantised time
const ks = (t, t0) => K(t) - Math.round(t0 * 12);       // steps since cue
function jit(id, t, amp = 2, fps = 12) {                // seeded hand-placement jitter (px, px, rad)
  const k = Math.floor(t * fps + 1e-4);
  return [(hash(id, k) * 2 - 1) * amp, (hash(id + 71, k) * 2 - 1) * amp, (hash(id + 913, k) * 2 - 1) * amp * 0.25 * DEG];
}
// slap: a piece drops from "camera" onto the page, hitting exactly on t0 (squash on impact, shadow collapses)
function slap(t, t0, pre = 3) {
  const k = ks(t, t0);
  if (k < -pre) return null;
  if (k < 0) { const u = -k / pre; return { s: 1 + 0.42 * u * u + 0.05 * u, lift: u, k }; }
  if (k === 0) return { s: 0.968, lift: 0, k, sq: 1 };
  if (k === 1) return { s: 1.012, lift: 0.03, k };
  return { s: 1, lift: 0, k };
}
function shadow(c, lift = 0, a = 0.34) {
  c.shadowColor = `rgba(34,20,8,${a + 0.1 * Math.min(lift, 1)})`;
  c.shadowBlur = 4 + lift * 30; c.shadowOffsetX = 3 + lift * 22; c.shadowOffsetY = 5 + lift * 30;
}
function noShadow(c) { c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetX = 0; c.shadowOffsetY = 0; }
const off = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const PAL = { ink: '#16130F', red: '#D2261C', cream: '#F2ECDF', news: '#E9E0CB', kraft: '#B9935F', blue: '#1F4E8C', gold: '#E2A72E' };
const PAT = { red: X.createPattern(I.red, 'repeat'), news: X.createPattern(I.news_a, 'repeat'), kraft: X.createPattern(I.kraft, 'repeat') };

// one call places a piece: slapped in at t0, boiling at rest, yanked off (3 steps) at t1
function put(c, t, img, x, y, o = {}) {
  const { s = 1, rot = 0, t0 = -1, t1 = 1e9, id = 1, amp, ax = .5, ay = .5, flip = false, pre = 3, sh = true, yank = [0, -1], alpha = 1, sx = 1, sy = 1 } = o;
  if (t < t0 - pre / 12) return null;
  const S = t0 >= 0 ? slap(t, t0, pre) : { s: 1, lift: 0, k: 99 };
  if (!S) return null;
  let dx = 0, dy = 0, r2 = 0, lift = S.lift;
  const ky = ks(t, t1);
  if (ky >= 0) { if (ky > 3) return null; const u = [0.08, 0.35, 0.75, 1.3][ky]; dx = yank[0] * u * 1400; dy = yank[1] * u * 1100; r2 = u * 14 * DEG * (hash(id, 3) > .5 ? 1 : -1); lift = 0.3 + u; }
  const moving = S.k < 3 || ky >= 0;
  const [jx, jy, jr] = jit(id, t, amp ?? (moving ? 2 : 1.1), moving ? 12 : 6);
  c.save(); c.translate(x + dx + jx, y + dy + jy); c.rotate(rot + r2 + jr);
  c.scale(s * S.s * sx * (flip ? -1 : 1) * (S.sq ? 1.02 : 1), s * S.s * sy * (S.sq ? 0.97 : 1));
  if (sh) shadow(c, lift); c.globalAlpha = alpha;
  c.drawImage(img, -img.width * ax, -img.height * ay);
  c.restore(); noShadow(c);
  return S;
}
// paper fibre / dust flecks puffing out of an impact for 2 steps
function flecks(c, x, y, k, seed, n = 10, rad = 200) {
  if (k < 0 || k > 1) return;
  c.save(); noShadow(c); c.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const a = hash(seed, i) * 2 * PI, d = rad * (0.8 + hash(seed + 1, i) * 0.6) + (k + 1) * 26;
    const px = x + Math.cos(a) * d, py = y + Math.sin(a) * d * 0.7;
    c.globalAlpha = k ? 0.4 : 0.9; c.strokeStyle = i % 3 ? PAL.cream : PAL.ink; c.lineWidth = 2 + hash(seed + 2, i) * 3;
    c.beginPath(); c.moveTo(px, py); c.lineTo(px + Math.cos(a) * 14, py + Math.sin(a) * 10); c.stroke();
  }
  c.restore();
}
function cutQuad(c, w, h, seed, j = 5) {
  const p = [[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2]];
  c.beginPath();
  p.forEach(([x, y], i) => { const dx = (hash(seed, i) * 2 - 1) * j, dy = (hash(seed + 5, i) * 2 - 1) * j; i ? c.lineTo(x + dx, y + dy) : c.moveTo(x + dx, y + dy); });
  c.closePath();
}
function tornRect(c, w, h, seed, rough = 9) {
  c.beginPath(); c.moveTo(-w / 2, -h / 2);
  const n = Math.max(8, Math.round(w / 40)), m = Math.max(4, Math.round(h / 30));
  for (let i = 1; i <= n; i++) c.lineTo(-w / 2 + w * i / n, -h / 2 + (hash(seed, i) - .5) * rough);
  for (let i = 1; i <= m; i++) c.lineTo(w / 2 + (hash(seed + 1, i) - .5) * rough, -h / 2 + h * i / m);
  for (let i = 1; i <= n; i++) c.lineTo(w / 2 - w * i / n, h / 2 + (hash(seed + 2, i) - .5) * rough);
  for (let i = 1; i < m; i++) c.lineTo(-w / 2 + (hash(seed + 3, i) - .5) * rough, h / 2 - h * i / m);
  c.closePath();
}
function tape(c, x, y, w, rot, seed, t, kraft = false) {
  const img = kraft ? I.tapeK : I.tapeW, [jx, jy] = jit(seed, t, 1, 6);
  c.save(); c.translate(x + jx, y + jy); c.rotate(rot); shadow(c, 0, 0.18); c.globalAlpha = 0.9;
  c.drawImage(img, 0, 0, img.width, img.height, -w / 2, -22, w, 44); c.restore(); noShadow(c);
}
// red constructivist tape strip (solid, torn ends) — crossing out, underlining, mending
function redTape(c, x, y, w, rot, seed, t, col = PAL.red, hgt = 46) {
  const [jx, jy, jr] = jit(seed, t, 1.2, 6);
  c.save(); c.translate(x + jx, y + jy); c.rotate(rot + jr); shadow(c, 0.02, 0.3);
  tornRect(c, w, hgt, seed, 7); c.fillStyle = col; c.fill(); noShadow(c);
  c.globalCompositeOperation = 'multiply'; c.globalAlpha = 0.25; c.fillStyle = PAT.red; c.fill(); c.restore();
}

// ------------------------------------------------------------------ type
function setFont(c, size, w = 800, stretch = 'normal') { c.font = `${w} ${size}px ${BN}`; c.fontStretch = stretch; }
// a word on its own scissor-cut chip (ransom / magazine type)
function chip(c, word, x, y, size, o = {}) {
  const { bg = PAL.cream, fg = PAL.ink, rot = 0, seed = 1, t = 0, t0 = -1, stretch = 'normal', w = 800, pad = 0.32, rim = true, s0 = 1 } = o;
  const S = t0 >= 0 ? slap(t, t0, 2) : { s: 1, lift: 0, k: 99 };
  if (!S) return 0;
  setFont(c, size, w, stretch);
  const tw = c.measureText(word).width, bw = tw + size * pad * 2, bh = size * 1.32;
  const [jx, jy, jr] = jit(seed, t, S.k < 3 ? 2 : 1, S.k < 3 ? 12 : 6);
  c.save(); c.translate(x + jx, y + jy); c.rotate(rot + jr); c.scale(S.s * s0, S.s * s0);
  if (rim) { cutQuad(c, bw + 12, bh + 12, seed, 4); c.fillStyle = PAL.cream; shadow(c, S.lift); c.fill(); noShadow(c); }
  cutQuad(c, bw, bh, seed + 9, 3); c.fillStyle = bg; if (!rim) shadow(c, S.lift); c.fill(); noShadow(c);
  if (bg === PAT.news) { c.fillStyle = 'rgba(236,229,214,.6)'; c.fill(); }
  c.fillStyle = fg; c.textAlign = 'center'; c.textBaseline = 'middle'; setFont(c, size, w, stretch);
  c.fillText(word, 0, size * 0.06);
  c.restore();
  return bw;
}
const wordsOf = s => s.split(/\s+/).filter(Boolean);
function wordTimes(l) {
  const ws = wordsOf(l.text), n = ws.reduce((a, w) => a + Math.max(2, w.length), 0), span = Math.max(0.35, (l.t1 - l.t0) * 0.82);
  let acc = 0; return ws.map(w => { const at = l.t0 + acc / n * span; acc += Math.max(2, w.length); return { w, at }; });
}
// lines that get the big constructivist treatment instead of the lyric strip
const BIG = /^(শেষ আলো জ্বলবেই|আলো জ্বলবেই|যুদ্ধ নয়|শান্তি চাই|ঘৃণা নয়|ভালোবাসা চাই|ক্ষমতা নয়|মানুষ বাঁচুক|একটি মানবতার ডাক)/;
const LINES = A.lines.map((l, i) => ({ ...l, i, big: BIG.test(l.text) }));
const lineAt = t => { let r = null; for (const l of LINES) if (t >= l.t0 - 0.05 && t < Math.min(l.t1 + 0.6, (LINES[l.i + 1]?.t0 ?? 1e9) - 0.02)) r = l; return r; };
const L = i => LINES[i];                                 // 0-based SRT index
// lyric strip: a torn newsprint strip slapped on the lower third, each word slapped on its sung time
function lyricStrip(c, t) {
  const l = lineAt(t);
  if (!l || l.big) return;
  const ws = wordTimes(l), size = l.text.length > 26 ? 66 : 74;
  setFont(c, size, 800);
  const gap = size * 0.3, widths = ws.map(({ w }) => c.measureText(w).width), tot = widths.reduce((a, b) => a + b, 0) + gap * (ws.length - 1);
  const bw = tot + 120, bh = size * 1.75, side = l.i % 2 ? 1 : -1;
  const S = slap(t, l.t0 - 0.08, 2); if (!S) return;
  const hold = Math.min(l.t1 + 0.6, (LINES[l.i + 1]?.t0 ?? 1e9) - 0.02), ky = ks(t, hold - 0.17);
  let dy = 0, rr = 0; if (ky >= 0) { dy = [20, 120, 380][Math.min(ky, 2)]; rr = ky * 3 * side * DEG; }
  const [jx, jy, jr] = jit(l.i * 7 + 3, t, S.k < 3 ? 2 : 1, S.k < 3 ? 12 : 6);
  c.save(); c.translate(W / 2 + side * 18 + jx, 948 + dy + jy); c.rotate(side * 1.2 * DEG + rr + jr); c.scale(S.s, S.s);
  tornRect(c, bw + 14, bh + 12, l.i * 13 + 1, 10); c.fillStyle = PAL.cream; shadow(c, S.lift); c.fill(); noShadow(c);
  tornRect(c, bw, bh, l.i * 13 + 5, 8); c.fillStyle = PAT.news; c.fill(); c.fillStyle = 'rgba(240,233,216,.82)'; c.fill();
  c.fillStyle = PAL.red; c.fillRect(-bw / 2 + 26, -bh / 2 + 14, 12, bh - 28);         // red rule, editorial finish
  c.textBaseline = 'middle'; c.textAlign = 'left';
  let x = -tot / 2 + 12;
  ws.forEach(({ w, at }, k) => {
    const kk = ks(t, at);
    if (kk >= -1) {
      const pop = kk < 0 ? 1.25 : kk === 0 ? 1.1 : 1;
      c.save(); c.translate(x + widths[k] / 2, size * 0.06 + (kk < 0 ? -10 : 0)); c.scale(pop, pop); c.globalAlpha = kk < 0 ? 0.45 : 1;
      setFont(c, size, 800); c.fillStyle = /শান্তি|মানুষ|আলো|পৃথিবী|যুদ্ধ|ক্ষমতা|ভালোবাসা|সকাল|সূর্য/.test(w) ? PAL.red : PAL.ink;
      c.textAlign = 'center'; c.fillText(w, 0, 0); c.restore();
    }
    x += widths[k] + gap;
  });
  c.restore();
}
// big constructivist type: words on a diagonal, alternating red slabs and ink chips, each slapped on its sung time
function bigType(c, t, l, o = {}) {
  const { x = W / 2, y = 760, rot = -8 * DEG, size = 150, scheme = 0 } = o;
  const ws = wordTimes(l);
  setFont(c, size, 800);
  const widths = ws.map(({ w }) => c.measureText(w).width + size * 0.64), tot = widths.reduce((a, b) => a + b, 0) + 18 * (ws.length - 1);
  const sc = Math.min(1, 1700 / tot);
  let cx = -tot / 2;
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(sc, sc);
  ws.forEach(({ w, at }, k) => {
    const pal = [[PAL.red, PAL.cream], [PAL.ink, PAL.cream], [PAL.cream, PAL.ink]][(k + scheme) % 3];
    const yo = (k % 2 ? 1 : -1) * size * 0.16;
    chip(c, w, cx + widths[k] / 2, yo, size, { bg: pal[0], fg: pal[1], rot: (hash(l.i, k) - .5) * 6 * DEG, seed: l.i * 31 + k, t, t0: at, stretch: 'semi-condensed' });
    cx += widths[k] + 18;
  });
  c.restore();
}
function bigLine(c, t, o) { const l = lineAt(t); if (l && l.big) bigType(c, t, l, o); }

// ------------------------------------------------------------------ shapes cut from paper
function dovePath(c, flap) {               // stylised dove facing right, ~220 px wide; flap 0 = wings up, 1 = down
  c.beginPath();
  c.moveTo(98, -14); c.lineTo(112, -9); c.lineTo(97, -4);
  c.bezierCurveTo(92, 6, 70, 12, 46, 13); c.bezierCurveTo(16, 15, -22, 12, -52, 6);
  c.lineTo(-104, 26); c.lineTo(-92, 6); c.lineTo(-108, -6); c.lineTo(-60, -7);
  c.bezierCurveTo(-26, -15, 18, -11, 40, -15); c.bezierCurveTo(56, -27, 80, -30, 98, -14); c.closePath();
  if (flap < 0.5) { c.moveTo(22, -12); c.bezierCurveTo(6, -62, -30, -100, -66, -118); c.lineTo(-54, -92); c.lineTo(-78, -96); c.lineTo(-56, -70); c.lineTo(-80, -66); c.bezierCurveTo(-48, -40, -30, -18, -14, -6); c.closePath(); }
  else { c.moveTo(22, -4); c.bezierCurveTo(8, 40, -20, 78, -56, 96); c.lineTo(-44, 70); c.lineTo(-70, 72); c.lineTo(-44, 48); c.lineTo(-64, 40); c.bezierCurveTo(-36, 20, -24, 6, -14, -2); c.closePath(); }
}
function dove(c, x, y, s, t, seed, o = {}) {
  const { rot = 0, flapFps = 6, col = PAL.cream, flip = false, lift = 0.2 } = o;
  const flap = Math.floor(t * flapFps + hash(seed) * 4) % 2, [jx, jy, jr] = jit(seed, t, 2, 12);
  c.save(); c.translate(x + jx, y + jy); c.rotate(rot + jr); c.scale(s * (flip ? -1 : 1), s);
  c.lineJoin = 'miter'; dovePath(c, flap); c.lineWidth = 9; c.strokeStyle = PAL.cream; shadow(c, lift); c.stroke(); noShadow(c);
  c.fillStyle = col; c.fill(); c.fillStyle = 'rgba(22,19,15,.9)'; c.beginPath(); c.arc(84, -15, 3.2, 0, 2 * PI); c.fill();
  c.restore();
}
function dollPath(c) {                     // one paper doll, hands at x = ±48 (so a chain joins hand to hand)
  c.beginPath();
  c.moveTo(-48, -40); c.lineTo(-18, -50); c.lineTo(-9, -56);
  c.arc(0, -76, 21, PI * 0.62, PI * 2.38, false);
  c.lineTo(18, -50); c.lineTo(48, -40); c.lineTo(48, -26); c.lineTo(20, -28); c.lineTo(22, 10); c.lineTo(30, 70); c.lineTo(10, 70);
  c.lineTo(0, 22); c.lineTo(-10, 70); c.lineTo(-30, 70); c.lineTo(-22, 10); c.lineTo(-20, -28); c.lineTo(-48, -26); c.closePath();
}
// an accordion-fold paper-doll chain, unfolding one doll per 12 fps step from t0
function dolls(c, t, x, y, n, s, t0, seed, o = {}) {
  const { fills = [PAL.red, PAL.cream, PAT.news, PAL.ink], hop = true, step = 1 } = o;
  const k = ks(t, t0); if (k < 0) return;
  const shown = Math.min(n, Math.floor(k / step) + 1);
  for (let i = 0; i < shown; i++) {
    const bob = hop ? (Math.floor(t * 6 + i) % 2) * -6 : 0, [jx, jy, jr] = jit(seed + i, t, 1.5, 6);
    c.save(); c.translate(x + (i - (n - 1) / 2) * 96 * s + jx, y + bob + jy); c.rotate(jr); c.scale(s, s);
    dollPath(c); c.lineWidth = 7; c.strokeStyle = PAL.cream; c.lineJoin = 'miter'; shadow(c, i === shown - 1 && k < n * step ? 0.4 : 0.05); c.stroke(); noShadow(c);
    c.fillStyle = fills[i % fills.length]; c.fill(); if (fills[i % fills.length] === PAT.news) { c.fillStyle = 'rgba(236,229,214,.55)'; c.fill(); }
    c.restore();
  }
}
// invented flags (no real national flags): paper rectangles on sticks
const FLAGS = [[PAL.red, PAL.ink], [PAL.blue, PAL.cream, PAL.blue], [PAL.gold, PAL.ink], [PAL.ink, PAL.red, PAL.cream], [PAL.cream, PAL.red]];
function flag(c, x, y, s, t, t0, seed) {

// ------------------------------------------------------------------ transitions (elements, never crossfades)
