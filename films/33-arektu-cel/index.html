</style></head><body><canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
// 33-arektu-cel — «আরেকটু থাকো» (Stay a little longer), Rapar Rubel. Frame-by-frame cel / line-boil story film, 1920×1080, 24 fps.
// Story: a rainy evening in an old Dhaka room. He sits by the window with two cups of tea and old photographs and remembers:
// the tea stall where they shared an umbrella. She has to go. One last rickshaw ride through the rain, the station, the train.
// He walks home alone, her outline still beside him; at home he sets two cups — and in the empty chair she is a smiling outline.
import { PI, DEG, clamp, lerp, eOut, eIn, eIO, eBack, hash, sh, FPS, F, on2, on3, boilK, bez, spline, ellipsePts, boil, ink, fill, shape,
  puff, star, sparks, speedLines, smear, letter, textW } from './cel.js';
import { ami, tumi, COL } from './chars.js';
const W = 1920, H = 1080, D = '/demos/33-arektu-cel/';
const A = await (await fetch(D + 'cues_audio.json')).json();
const LN = await (await fetch(D + 'lines.json')).json();
const DUR = A.duration;
window.DEMO = { width: W, height: H, fps: 24, duration: DUR };
const cv = document.getElementById('c'), X = cv.getContext('2d');
const loadImg = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(src); i.src = src; });
const paper = await loadImg('/assets/textures/paper/Paper001_4K_color.jpg');
const grain = await loadImg('/assets/textures/grain/grain_fine_2048.png');
await Promise.all([paper.decode(), grain.decode()]);
for (const f of ['600 60px "Atma"', '500 60px "Atma"', '400 120px "Galada"'])
  await document.fonts.load(f, 'আরেকটু থাকো কণ্ঠ ও কথা সম্পাদনা Rapar Rubel Paloan');
await document.fonts.ready;

const C = { ...COL, blue: '#5E7C8C', blueD: '#3E5664', blueL: '#9DB4B8', dusk: '#7A6C8A', duskL: '#B49AA0', wall: '#D8C7A2', wallD: '#B9A27C',
  wood: '#8A5A34', woodD: '#5C3B22', lamp: '#FFD27A', green: '#6F8A4C', train: '#3F6B4E', trainL: '#5E8A68', rust: '#A65A3A' };
const INK = C.ink;
const LINES = LN.map((l, i) => ({ ...l, i }));
const t0 = i => LINES[i].t0, t1 = i => LINES[i].t1;
// sections: [name, first lyric line] — each starts a little before its first line
const SEC_DEF = [['open', -1], ['room', 0], ['table', 4], ['memory', -2], ['leave', 8], ['ride', 14], ['station', -3], ['bridge', 24], ['depart', 32],
  ['walk', 38], ['home', -4], ['outro', 42]];
const special = { '-2': t1(7) + 0.5, '-3': t1(23) + 0.6, '-4': t1(41) + 0.8 };
const SECS = SEC_DEF.map(([n, li], i) => [n, i === 0 ? 0 : li < -1 ? special[li] : Math.max(0, t0(li) - 0.6)]);
SECS.forEach((s, i) => s.push(SECS[i + 1] ? SECS[i + 1][1] : DUR + 1));
const secAt = t => SECS.find(s => t >= s[1] && t < s[2]) || SECS[SECS.length - 1];
const lineAt = t => { let r = null; for (const l of LINES) if (t >= l.t0 - 0.05 && t < Math.min(l.t1 + 0.7, (LINES[l.i + 1]?.t0 ?? 1e9) - 0.04)) r = l; return r; };
const vocAt = t => A.voc[Math.min(A.voc.length - 1, Math.floor(on2(t) / DUR * A.voc.length))] || 0;
const singing = t => { const l = lineAt(t); return l && t < l.t1 + 0.05 ? clamp((vocAt(t) - 0.25) / 0.5) : 0; };
const blinkAt = (t, p = 90, o = 0) => (F(t) + o) % p < 3;

// ------------------------------------------------------------------ paper ground + finishing
function ground(c, col = C.paper) { c.fillStyle = col; c.fillRect(0, 0, W, H); }
function finish(c, t) {
  const k = boilK(t);
  c.save(); c.globalCompositeOperation = 'multiply'; c.globalAlpha = 0.13; c.drawImage(paper, (k % 2) * -40, (k >> 1) * -30, W + 80, H + 60); c.restore();
  c.save(); c.globalCompositeOperation = 'overlay'; c.globalAlpha = 0.12; c.drawImage(grain, -(k * 97 % 300), -(k * 53 % 300)); c.restore();
  const g = c.createRadialGradient(W / 2, H / 2, H * 0.5, W / 2, H / 2, H * 1.05); g.addColorStop(0, 'rgba(40,30,30,0)'); g.addColorStop(1, 'rgba(40,30,30,.2)');
  c.save(); c.globalCompositeOperation = 'multiply'; c.fillStyle = g; c.fillRect(0, 0, W, H); c.restore();
}
function bandsIn(c, ys, cols) { cols.forEach((col, i) => { c.fillStyle = col; c.fillRect(-500, ys[i], 1000, (ys[i + 1] ?? 400) - ys[i] + 1); }); }
function bands(c, ys, cols) { cols.forEach((col, i) => { c.fillStyle = col; c.fillRect(0, ys[i], W, (ys[i + 1] ?? H) - ys[i] + 1); }); }
function rect(c, x0, y0, x1, y1, col, id, k, w = 3.4, reg = 2) { shape(c, [[x0, y0], [x1, y0], [x1, y1], [x0, y1]], col, { w, id, k, reg }); }
function rrect(x0, y0, x1, y1, r, n = 5) {
  const out = [], C4 = [[x1 - r, y0 + r, -PI / 2], [x1 - r, y1 - r, 0], [x0 + r, y1 - r, PI / 2], [x0 + r, y0 + r, PI]];
  for (const [cx, cy, a0] of C4) for (let i = 0; i <= n; i++) { const a = a0 + i / n * PI / 2; out.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return out;
}
// rain drawn on 2s: slanted dashes that jump between drawings (cel rain, never particles)
function rain(c, t, n = 90, o = {}) {
  const { x0 = 0, y0 = 0, x1 = W, y1 = H, col = 'rgba(31,26,23,.5)', len = 38, slant = 9, id = 4010, freeze = null } = o;
  const f = freeze != null ? freeze : Math.floor(F(t) / 2);
  for (let i = 0; i < n; i++) {
    const x = x0 + ((hash(id, i) * (x1 - x0) + f * 23) % (x1 - x0)), y = y0 + ((hash(id + 1, i) * (y1 - y0) + f * 74) % (y1 - y0));
    ink(c, [[x, y], [x - slant, y + len]], 2.2, { id: id + i, k: f % 4, col, amp: 0.4, taper: 0.6 });
  }
}
function splashes(c, t, y0, y1, n, id, x0 = 0, x1 = W) {
  for (let i = 0; i < n; i++) { const ph = (Math.floor(F(t) / 2) + i * 5) % 12; if (ph < 4) { const cyc = Math.floor((F(t) / 2 + i * 5) / 12);
    const x = x0 + hash(id, i, cyc) * (x1 - x0), y = y0 + hash(id + 1, i, cyc) * (y1 - y0), s = [0.5, 1, 1.2, 0.8][ph];
    for (let j = -2; j <= 2; j++) ink(c, [[x + j * 5, y], [x + j * 13 * s, y - 20 * s]], 2.2, { id: id + 40 + i * 5 + j, k: ph }); } }
}
function sun(c, x, y, r, k, col = C.red, id = 5) { shape(c, ellipsePts(x, y, r, r, 36), col, { w: 4, id, k, reg: 4 }); }
function crow(c, x, y, s, t, k, id) { const f = Math.floor(on2(t) * 6 + id) % 2; ink(c, [[x - 18 * s, y - (f ? 8 : -4) * s], [x, y], [x + 18 * s, y - (f ? 8 : -4) * s]], 3.2 * s, { id, k, taper: 0.8 }); }

// ------------------------------------------------------------------ props
function cup(c, x, y, s, k, id, o = {}) {          // a glass tea cup on a saucer (cha), steam on 2s
  const { steam = true, t = 0, lip = false, full = 1 } = o;
  c.save(); c.translate(x, y); c.scale(s, s);
  shape(c, ellipsePts(0, 0, 70, 14, 18), C.cream, { w: 3, id, k });
  shape(c, [[-42, -8], [42, -8], [34, -86], [-34, -86]], '#FAF3E3', { w: 3.2, id: id + 1, k });
  if (full) fill(c, [[-38, -14], [38, -14], [33, -70 * full], [-33, -70 * full]], '#B8743A', { id: id + 2, k, reg: 0 });
  ink(c, spline([[40, -70], [64, -66], [62, -36], [38, -30]], false, 5), 3, { id: id + 3, k });
  if (lip) fill(c, ellipsePts(-22, -84, 8, 3, 10), C.red, { id: id + 4, k, reg: 0 });
  if (steam) for (let i = 0; i < 3; i++) puff(c, -16 + i * 16, -120, 18, ((on2(t) * 0.5 + i * 0.33) % 1), id + 10 + i, k, '#F3E9D2');
  c.restore();
}
function photo(c, x, y, s, rot, k, id, o = {}) {   // a small polaroid: the two of them under one umbrella
  const { t = 0 } = o;
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s);
  shape(c, [[-120, -140], [120, -140], [120, 150], [-120, 150]], '#FAF3E3', { w: 3.2, id, k });
  c.save(); c.beginPath(); c.rect(-100, -120, 200, 210); c.clip();
  c.fillStyle = C.blueL; c.fillRect(-100, -120, 200, 210);
  for (let i = 0; i < 12; i++) ink(c, [[-90 + hash(id, i) * 180, -110 + hash(id + 1, i) * 180], [-94 + hash(id, i) * 180, -92 + hash(id + 1, i) * 180]], 1.6, { id: id + 20 + i, k, col: 'rgba(31,26,23,.4)' });
  ami(c, -30, 110, 0.36, t, k, { aR: 1.2, eR: 1.0 }, { id: id + 40, shadow: false });
  tumi(c, 32, 110, 0.36, t, k, { aL: 0.4, smile: 1 }, { id: id + 60, shadow: false });
  shape(c, spline([[-110, -40], [-40, -100], [40, -104], [110, -44], [60, -50], [0, -42], [-60, -50]], true, 3), C.red, { w: 3, id: id + 80, k });
  c.restore(); c.restore();
}
function wallClock(c, x, y, r, t, k, o = {}) {      // hands: real time by default; spin = fast (smear on 1s); stop = hands frozen
  const { spin = null, frozen = null, id = 1600 } = o;
  shape(c, ellipsePts(x, y, r + 10, r + 10, 30), C.woodD, { w: 4, id, k });
  shape(c, ellipsePts(x, y, r, r, 30), C.cream, { w: 3, id: id + 1, k });
  for (let i = 0; i < 12; i++) { const a = i / 12 * 2 * PI; ink(c, [[x + Math.cos(a) * r * 0.8, y + Math.sin(a) * r * 0.8], [x + Math.cos(a) * r * 0.92, y + Math.sin(a) * r * 0.92]], 3, { id: id + 10 + i, k }); }
  let mins = frozen ?? (40 + on2(t) / 60 * 6);
  let fast = false;
  if (spin) { const u = clamp((t - spin[0]) / spin[1]); mins += eIO(u) * 60 * 5; fast = u > 0.1 && u < 0.9; if (fast) mins = 40 + Math.floor(F(t)) * 9; }
  const hand = (len, a, w, hid) => ink(c, [[x, y], [x + Math.sin(a) * len, y - Math.cos(a) * len]], w, { id: hid, k });
  const am = mins / 60 * 2 * PI, ah = (5 + mins / 60) / 12 * 2 * PI;
  if (fast) { for (let s = 0; s < 3; s++) { c.globalAlpha = 0.3 + s * 0.3; hand(r * 0.78, am - (2 - s) * 0.3, 4, id + 30 + s); } c.globalAlpha = 1; }
  else hand(r * 0.78, am, 4, id + 30);
  hand(r * 0.5, ah, 6, id + 34);
  c.fillStyle = INK; c.beginPath(); c.arc(x, y, 6, 0, 2 * PI); c.fill();
}
function umbrella(c, x, y, s, k, id, col = C.red, tilt = 0) {
  c.save(); c.translate(x, y); c.rotate(tilt); c.scale(s, s);
  shape(c, spline([[-200, 30], [-150, -60], [0, -100], [150, -60], [200, 30], [140, 18], [70, 32], [0, 18], [-70, 32], [-140, 18]], true, 3), col, { w: 4, id, k });
  for (const xx of [-70, 0, 70]) ink(c, [[0, -96], [xx, 26]], 2, { id: id + 2 + xx, k, col: 'rgba(31,26,23,.5)' });
  ink(c, [[0, -100], [0, 230]], 4, { id: id + 1, k }); ink(c, spline([[0, 230], [0, 252], [-20, 256], [-24, 236]], false, 4), 4, { id: id + 5, k });
  c.restore();
}
function suitcase(c, x, y, s, k, id) {
  c.save(); c.translate(x, y); c.scale(s, s);
  shape(c, rrect(-110, -170, 110, 0, 16), C.rust, { w: 3.6, id, k });
  shape(c, rrect(-40, -205, 40, -165, 10), null, { w: 6, id: id + 1, k });
  for (const xx of [-60, 60]) ink(c, [[xx, -170], [xx, 0]], 3, { id: id + 2 + xx, k });
  for (const xx of [-80, 80]) shape(c, ellipsePts(xx, 6, 12, 10, 10), INK, { w: 2, id: id + 5 + xx, k });
  c.restore();
}
function hand(c, x, y, ang, s, col, k, id, sleeve) {   // a big close-up hand (forearm + palm + 4 fingers), pointing along ang
  c.save(); c.translate(x, y); c.rotate(ang); c.scale(s, s);
  shape(c, [[-400, -48], [-60, -40], [-60, 40], [-400, 50]], sleeve, { w: 4, id: id + 9, k });
  shape(c, spline([[-70, -46], [10, -52], [56, -40], [70, -10], [62, 30], [10, 46], [-70, 44]], true, 4), col, { w: 4, id, k });
  for (let i = 0; i < 4; i++) shape(c, rrect(50, -46 + i * 23, 140 - Math.abs(i - 1.3) * 14, -26 + i * 23, 9), col, { w: 3, id: id + 1 + i, k });
  shape(c, spline([[0, -50], [40, -84], [72, -86], [70, -66], [30, -38]], true, 3), col, { w: 3, id: id + 7, k });
  c.restore();
}

// lyric lettering: hand-lettered on a drawn paper card in the lower third; each word inks in on its sung time
function lyric(c, t, o = {}) {
  const l = lineAt(t); if (!l) return;
  const { y = 980, size = 54, card = true, col = INK, dark = false } = o;
  const k = boilK(t), ws = l.text.split(/\s+/).filter(Boolean);
  const n = ws.reduce((a, w) => a + Math.max(2, w.length), 0), span = Math.max(0.35, (l.t1 - l.t0) * 0.85);
  const gap = size * 0.32, widths = ws.map(w => textW(w, size, '"Atma"', 600)), tot = widths.reduce((a, b) => a + b, 0) + gap * (ws.length - 1);
  const hold = Math.min(l.t1 + 0.7, (LINES[l.i + 1]?.t0 ?? 1e9) - 0.04), out = clamp((t - (hold - 0.25)) / 0.25);
  if (card) {
    const cw = tot + 110, ch = size * 1.6, sq = F(t) - F(l.t0) < 2 ? 0.92 + 0.04 * (F(t) - F(l.t0)) : 1;
    c.save(); c.translate(W / 2, y + out * 30); c.scale(sq, sq); c.globalAlpha = 1 - out;
    shape(c, spline([[-cw / 2, -ch / 2], [0, -ch / 2 - 6], [cw / 2, -ch / 2], [cw / 2 + 10, 0], [cw / 2, ch / 2], [0, ch / 2 + 5], [-cw / 2, ch / 2], [-cw / 2 - 10, 0]], true, 4), dark ? INK : C.cream, { w: 3, id: 7000 + l.i, k, reg: 3 });
    c.restore();
  }
  let acc = 0, x = W / 2 - tot / 2;
  ws.forEach((w, j) => {
    const at = l.t0 + acc / n * span; acc += Math.max(2, w.length);
    const df = F(t) - F(at);
    if (df >= 0) {
      const pop = df === 0 ? 1.18 : df === 1 ? 1.06 : 1;
      c.save(); c.globalAlpha = 1 - out; c.translate(x + widths[j] / 2, y + out * 30); c.scale(pop, pop);
      const hot = /থাকো|সময়|বিদায়|সন্ধ্যা|মুহূর্তটা|দেখা|পথটা|তোমারই|বৃষ্টি|ছবি|দূরে|কাছে|হাসব/.test(w);
      letter(c, w, 0, 0, { size, col: dark ? C.cream : hot ? C.red : col, k, id: 7100 + l.i * 20 + j, weight: 600 });
      c.restore();
    }
    x += widths[j] + gap;
  });
}

// ------------------------------------------------------------------ the room (old Dhaka, rainy evening)
function room(c, t, k, o = {}) {
  const { sky = C.blue, lampOn = 0, rainOn = 1, chairHer = true } = o;
  ground(c, C.wall);
  for (let i = 0; i < 14; i++) ink(c, [[i * 150 + 40, 0], [i * 150 + 40, 760]], 1.4, { id: 1000 + i, k, col: 'rgba(31,26,23,.12)' });   // old plaster seams
  // the window: green wooden shutters open, iron bars, rain outside
  rect(c, 1080, 150, 1700, 650, sky, 1010, k, 5);
  c.save(); c.beginPath(); c.rect(1080, 150, 620, 500); c.clip();
  shape(c, [[1080, 520], [1180, 470], [1260, 500], [1360, 430], [1460, 470], [1560, 420], [1700, 460], [1700, 650], [1080, 650]], C.blueD, { w: 3, id: 1011, k });   // rooftops opposite
  for (let i = 0; i < 9; i++) { c.fillStyle = hash(1012, i) > 0.4 ? C.lamp : 'rgba(31,26,23,.4)'; c.fillRect(1110 + i * 66, 500 + (i % 3) * 30, 14, 18); }
  if (rainOn) rain(c, t, 40, { x0: 1080, y0: 150, x1: 1700, y1: 650, col: 'rgba(240,240,235,.55)', id: 1020 });
  c.restore();
  for (let i = 1; i < 8; i++) ink(c, [[1080 + i * 77, 150], [1080 + i * 77, 650]], 5, { id: 1040 + i, k });
  ink(c, [[1080, 400], [1700, 400]], 4, { id: 1049, k });
  rect(c, 960, 140, 1080, 660, C.green, 1050, k); rect(c, 1700, 140, 1820, 660, C.green, 1051, k);
  for (let i = 0; i < 9; i++) { ink(c, [[968, 170 + i * 52], [1072, 182 + i * 52]], 2.4, { id: 1052 + i, k }); ink(c, [[1708, 182 + i * 52], [1812, 170 + i * 52]], 2.4, { id: 1062 + i, k }); }
  rect(c, 1050, 650, 1730, 690, C.wood, 1072, k);                                     // sill
  // floor and the table by the window
  bands(c, [760], ['#A98A62']); ink(c, [[0, 760], [W, 760]], 4, { id: 1073, k });
  for (let i = 0; i < 9; i++) ink(c, [[i * 240 - 60, 1080], [i * 240 + 60, 760]], 1.6, { id: 1074 + i, k, col: 'rgba(31,26,23,.25)' });
  // the wall clock and a calendar
  wallClock(c, 420, 230, 82, t, k, o.clock || {});
  rect(c, 640, 150, 820, 360, C.cream, 1090, k); rect(c, 640, 150, 820, 200, C.red, 1091, k);
  for (let r = 0; r < 4; r++) for (let q = 0; q < 5; q++) { c.fillStyle = 'rgba(31,26,23,.35)'; c.fillRect(658 + q * 32, 220 + r * 32, 14, 12); }
  // the hurricane lamp on the shelf
  rect(c, 180, 470, 560, 490, C.wood, 1095, k);
  const lx = 280; shape(c, ellipsePts(lx, 400, 34, 48, 16), lampOn ? C.lamp : '#E8E0C8', { w: 3, id: 1096, k }); rect(c, lx - 40, 445, lx + 40, 470, C.rust, 1097, k); ink(c, spline([[lx - 30, 350], [lx, 320], [lx + 30, 350]], false, 5), 3, { id: 1098, k });
  if (lampOn) { c.save(); c.globalAlpha = 0.18 * lampOn; c.fillStyle = C.lamp; c.beginPath(); c.arc(lx, 400, 260, 0, 2 * PI); c.fill(); c.restore(); fill(c, ellipsePts(lx, 410, 9, 16, 10), '#FF9A3A', { id: 1099, k, reg: 0 }); }
  for (let i = 0; i < 4; i++) rect(c, 400 + i * 30, 380 - (i % 2) * 14, 424 + i * 30, 470, [C.red, C.yellow, C.green, C.cream][i], 1100 + i, k, 2.6);   // books
}
function table(c, k, x0 = 760, x1 = 1500, y = 760) {
  rect(c, x0, y - 30, x1, y, C.wood, 1200, k, 4);
  for (const xx of [x0 + 30, x1 - 50]) rect(c, xx, y, xx + 22, y + 230, C.woodD, 1201 + xx, k);
}
function chair(c, x, y, k, id, flip = 1) {
  rect(c, x - 80, y - 210, x + 80, y - 190, C.woodD, id, k);
  rect(c, x + flip * 70 - 10, y - 420, x + flip * 70 + 10, y, C.woodD, id + 1, k);
  rect(c, x - flip * 70 - 10, y - 200, x - flip * 70 + 10, y, C.woodD, id + 2, k);
  for (let i = 0; i < 3; i++) rect(c, x + flip * 60 - 8, y - 400 + i * 50, x + flip * 80 + 8, y - 386 + i * 50, C.wood, id + 3 + i, k, 2.4);
}

// ------------------------------------------------------------------ scenes
const SC = {};
function titleCard(c, t, ta) {
  const k = boilK(t, 3), u = eBack(clamp((on2(t) - ta) / 0.6)), out = clamp((t - (t0(0) - 1.6)) / 0.4);
