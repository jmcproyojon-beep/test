</style></head><body><canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
// 31-amader-jawa — «আমাদের আর যাওয়া হলো না» (We never got to go). Frame-by-frame cel / line-boil lyric film, 1920×1080, 24 fps.
// Story: two people planned a small trip "not very far" — a kash-phool field by a river ghat at sunset. Life happened.
// The place stays beautiful; the two of them are drawn there only as a boiling dashed outline. In the end he goes alone,
// keeps the photo for himself, and learns to walk his own road.
import { PI, DEG, clamp, lerp, eOut, eIn, eIO, eBack, hash, sh, FPS, F, on2, on3, boilK, bez, spline, ellipsePts, boil, ink, fill, shape,
  puff, star, sparks, speedLines, smear, letter, textW } from './cel.js';
import { ami, tumi, COL } from './chars.js';
const W = 1920, H = 1080, D = '/demos/31-amader-jawa/';
const A = await (await fetch(D + 'cues_audio.json')).json();
const LN = await (await fetch(D + 'lines.json')).json();
const DUR = A.duration;
window.DEMO = { width: W, height: H, fps: 24, duration: DUR };
const cv = document.getElementById('c'), X = cv.getContext('2d');
const loadImg = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(src); i.src = src; });
const paper = await loadImg('/assets/textures/paper/Paper001_4K_color.jpg');
const grain = await loadImg('/assets/textures/grain/grain_fine_2048.png');
await Promise.all([paper.decode(), grain.decode()]);
for (const f of ['600 60px "Atma"', '500 60px "Atma"', '400 120px "Galada"'])
  await document.fonts.load(f, 'আমাদের আর যাওয়া হলো না সেই জায়গাটায় কণ্ঠ ও কথা সম্পাদনা সিলেট কক্সবাজার রাঙামাটি ২ জন ঢাকা — “” ABC');
await document.fonts.ready;

const C = COL, INK = C.ink;
const LINES = LN.map((l, i) => ({ ...l, i }));
const L = i => LINES[i];
const t0 = i => LINES[i].t0;
// sections: [name, first lyric line] — each starts a little before its first line
const SEC_DEF = [['open', -1], ['rooftop', 0], ['phone', 8], ['office', 12], ['alone', 16], ['words', 20], ['place1', 24], ['house', 32],
  ['street', 40], ['lost', 48], ['place2', 52], ['bridge', 60], ['final', 68], ['outro', 80]];
const SECS = SEC_DEF.map(([n, li], i) => [n, i === 0 ? 0 : Math.max(0, t0(li) - (n === 'place1' || n === 'place2' || n === 'final' ? 0.9 : 0.6))]);
SECS.forEach((s, i) => s.push(SECS[i + 1] ? SECS[i + 1][1] : DUR + 1));
const secAt = t => SECS.find(s => t >= s[1] && t < s[2]) || SECS[SECS.length - 1];
const lineAt = t => { let r = null; for (const l of LINES) if (t >= l.t0 - 0.05 && t < Math.min(l.t1 + 0.7, (LINES[l.i + 1]?.t0 ?? 1e9) - 0.04)) r = l; return r; };
const vocAt = t => A.voc[Math.min(A.voc.length - 1, Math.floor(on2(t) * 24))] || 0;
const singing = t => { const l = lineAt(t); return l && t < l.t1 + 0.05 ? clamp((vocAt(t) - 0.25) / 0.5) : 0; };

// ------------------------------------------------------------------ paper ground + finishing
function ground(c, col = C.paper) { c.fillStyle = col; c.fillRect(0, 0, W, H); }
function finish(c, t) {
  const k = boilK(t);
  c.save(); c.globalCompositeOperation = 'multiply'; c.globalAlpha = 0.13; c.drawImage(paper, (k % 2) * -40, (k >> 1) * -30, W + 80, H + 60); c.restore();
  c.save(); c.globalCompositeOperation = 'overlay'; c.globalAlpha = 0.12; c.drawImage(grain, -(k * 97 % 300), -(k * 53 % 300)); c.restore();
  const g = c.createRadialGradient(W / 2, H / 2, H * 0.5, W / 2, H / 2, H * 1.05); g.addColorStop(0, 'rgba(70,40,10,0)'); g.addColorStop(1, 'rgba(70,40,10,.16)');
  c.save(); c.globalCompositeOperation = 'multiply'; c.fillStyle = g; c.fillRect(0, 0, W, H); c.restore();
}
// flat horizontal colour bands (no gradients: cel painting)
function bands(c, ys, cols) { cols.forEach((col, i) => { c.fillStyle = col; c.fillRect(0, ys[i], W, (ys[i + 1] ?? H) - ys[i] + 1); }); }
// a drawn stroke revealed progressively (draw-on), u = 0..1
function drawOn(c, pts, u, w, o = {}) { const n = Math.max(2, Math.floor(pts.length * clamp(u))); if (u > 0) ink(c, pts.slice(0, n), w, o); }

function rrect(x0, y0, x1, y1, r, n = 5) {
  const out = [], C4 = [[x1 - r, y0 + r, -PI / 2], [x1 - r, y1 - r, 0], [x0 + r, y1 - r, PI / 2], [x0 + r, y0 + r, PI]];
  for (const [cx, cy, a0] of C4) for (let i = 0; i <= n; i++) { const a = a0 + i / n * PI / 2; out.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return out;
}
// ------------------------------------------------------------------ world pieces
function sun(c, x, y, r, k, col = C.red, rays = 0, id = 5) {
  if (rays) for (let i = 0; i < 14; i++) { const a = i / 14 * 2 * PI + (k % 2) * 0.04; ink(c, [[x + Math.cos(a) * r * 1.18, y + Math.sin(a) * r * 1.18], [x + Math.cos(a) * r * (1.18 + rays), y + Math.sin(a) * r * (1.18 + rays)]], 4, { id: id + i, k }); }
  shape(c, ellipsePts(x, y, r, r, 36), col, { w: 4, id, k, reg: 4 });
}
function river(c, y0, y1, t, k, col = '#E7C27A', o = {}) {
  const { flow = 1, glint = true, sunX = 1240, id = 900 } = o;
  c.fillStyle = col; c.fillRect(0, y0, W, y1 - y0);
  ink(c, spline([[0, y0], [480, y0 - 4], [960, y0 + 3], [1440, y0 - 3], [1920, y0 + 2]], false, 8), 4, { id, k });
  for (let r = 0; r < 7; r++) {                                   // wave dashes drifting on 2s
    const yy = y0 + 18 + r * (y1 - y0 - 30) / 7, off = (on2(t) * 40 * flow + r * 137) % 220;
    for (let i = -1; i < 10; i++) { const x = i * 220 + off - 110 + (r % 2) * 90, l = 40 + 30 * hash(id, r, i); ink(c, [[x, yy], [x + l * 0.5, yy - 3], [x + l, yy]], 2.6, { id: id + r * 20 + i, k }); }
  }
  if (glint) for (let i = 0; i < 6; i++) { const yy = y0 + 14 + i * 20, ww = 120 - i * 14; fill(c, ellipsePts(sunX + sh(id, i, k) * 6, yy, ww, 4, 12), C.red, { id: id + 90 + i, k, reg: 0 }); }
}
function farBank(c, y, k, col = '#D9B97E') {
  const pts = [[-10, y + 40], [-10, y]];
  for (let i = 0; i <= 24; i++) pts.push([i * 80, y - 14 - 22 * hash(77, i) - (i % 5 === 2 ? 36 : 0)]);
  pts.push([1930, y], [1930, y + 40]);
  shape(c, spline(pts, true, 3), col, { w: 3, id: 950, k, reg: 2 });
}
function kash(c, x, y, h, t, k, id, wind = 0) {                 // kash-phool: a stalk with a white feathery plume, swaying on 2s
  const sw = Math.sin(on2(t) * 1.6 + id) * 6 + wind * 40;
  const tip = [x + sw, y - h], mid = [x + sw * 0.35, y - h * 0.55];
  ink(c, [[x, y], mid, tip], 2.6, { id, k, taper: 0.6 });
  const lean = 0.45 + wind * 0.9 + sh(id, 6) * 0.15, len = 96 + 26 * hash(id, 7), wid = 12 + 5 * hash(id, 8);
  const ax = Math.sin(lean) * len, ay = -Math.cos(lean) * len;
  const plume = [];                                   // a feathery lens: wavy edges like kash fluff
  for (let i = 0; i <= 12; i++) { const u = i / 12, bulge = Math.sin(u * PI) * wid * (1 + 0.18 * Math.sin(i * 2.3));
    plume.push([tip[0] + ax * u + Math.cos(lean) * bulge, tip[1] + ay * u + Math.sin(lean) * bulge]); }
  for (let i = 12; i >= 0; i--) { const u = i / 12, bulge = Math.sin(u * PI) * wid * 0.55 * (1 + 0.2 * Math.cos(i * 1.9));
    plume.push([tip[0] + ax * u - Math.cos(lean) * bulge, tip[1] + ay * u - Math.sin(lean) * bulge]); }
  shape(c, plume, '#FBF6EA', { w: 1.7, id: id + 3, k, reg: 2 });
  for (let i = 1; i < 5; i++) ink(c, [[tip[0] + ax * i / 5, tip[1] + ay * i / 5], [tip[0] + ax * (i + 0.6) / 5 + Math.cos(lean) * 12, tip[1] + ay * (i + 0.6) / 5 + Math.sin(lean) * 12]], 1.4, { id: id + 10 + i, k, col: 'rgba(31,26,23,.45)' });
}
function kashField(c, y, t, k, n = 46, wind = 0, seed = 0, gone = null, clear = [880, 1480]) {
  for (let i = 0; i < n; i++) {
    if (i % 2 && n > 30) { const xb = (i / n) * 2000 - 10; if (!(clear && xb > clear[0] && xb < clear[1])) kash(c, xb, y - 40 + hash(seed + 7, i) * 30, 90 + hash(seed + 8, i) * 60, t, k, 2600 + seed * 100 + i, wind); }
    const x = (i / n) * 2000 - 40 + sh(seed + 3, i) * 18, yy = y + hash(seed, i) * 90, h = 120 + hash(seed + 1, i) * 90;
    if (gone && gone(i)) continue;
    if (clear && x > clear[0] && x < clear[1] && h > 130) continue;
    kash(c, x, yy, h, t, k, 2000 + seed * 100 + i, wind);
  }
}
function krishnachura(c, x, y, k, t, bloom = 1, id = 3000) {     // the flame tree: dark trunk, red blossom clusters
  shape(c, [[x - 18, y], [x - 10, y - 220], [x - 40, y - 300], [x - 22, y - 304], [x + 4, y - 250], [x + 30, y - 320], [x + 46, y - 312], [x + 14, y - 220], [x + 20, y]], '#5C4A3E', { w: 3.6, id, k });
  const cl = [[x - 150, y - 330, 90], [x - 40, y - 400, 110], [x + 90, y - 360, 100], [x + 190, y - 300, 70], [x - 220, y - 270, 60], [x + 20, y - 290, 80]];
  cl.forEach(([cx, cy, r], i) => shape(c, spline(Array.from({ length: 9 }, (_, j) => { const a = j / 9 * 2 * PI; const rr = r * (0.8 + 0.3 * hash(id, i, j)) * bloom; return [cx + Math.cos(a) * rr * 1.25, cy + Math.sin(a) * rr * 0.8]; }), true, 3), i % 2 ? C.red : '#C93A28', { w: 3.4, id: id + 10 + i, k }));
  for (let i = 0; i < 26; i++) { const a = hash(id, i) * 2 * PI, d = hash(id + 1, i) * 200; c.fillStyle = C.yellow; c.beginPath(); c.arc(x - 30 + Math.cos(a) * d * 1.2, y - 340 + Math.sin(a) * d * 0.5, 3.5, 0, 2 * PI); c.fill(); }
}
function bench(c, x, y, k, id = 3100) {
  shape(c, [[x - 190, y - 70], [x + 190, y - 70], [x + 190, y - 52], [x - 190, y - 52]], '#9C6B3E', { w: 3.4, id, k });
  shape(c, [[x - 190, y - 120], [x + 190, y - 120], [x + 190, y - 100], [x - 190, y - 100]], '#9C6B3E', { w: 3.4, id: id + 1, k });
  for (const lx of [-170, 160]) shape(c, [[x + lx, y - 52], [x + lx + 14, y - 52], [x + lx + 14, y], [x + lx, y]], '#7A5230', { w: 3, id: id + 2 + lx, k });
  for (const lx of [-150, 140]) shape(c, [[x + lx, y - 120], [x + lx + 12, y - 120], [x + lx + 12, y - 52], [x + lx, y - 52]], '#7A5230', { w: 3, id: id + 5 + lx, k });
}
function nouka(c, x, y, s, k, t, id = 3200, sail = true) {      // a country boat with a patched sail
  c.save(); c.translate(x, y + Math.sin(on2(t) * 2) * 3); c.scale(s, s);
  shape(c, spline([[-130, -10], [-60, 14], [60, 14], [140, -16], [100, -2], [-100, -2]], true, 4), '#5C4A3E', { w: 3.4, id, k });
  if (sail) { ink(c, [[-6, -2], [-6, -170]], 4, { id: id + 1, k }); shape(c, [[-2, -165], [70, -150], [84, -30], [-2, -14]], C.cream, { w: 3.2, id: id + 2, k });
    shape(c, [[30, -120], [70, -112], [76, -70], [34, -76]], C.red, { w: 2.4, id: id + 3, k }); }
  c.restore();
}
function crow(c, x, y, s, t, k, id) { const f = Math.floor(on2(t) * 6 + id) % 2; ink(c, [[x - 18 * s, y - (f ? 8 : -4) * s], [x, y], [x + 18 * s, y - (f ? 8 : -4) * s]], 3.2 * s, { id, k, taper: 0.8 }); }
// lyric lettering: hand-lettered on a drawn paper card in the lower third; each word inks in on its sung time (2-frame scribble-in)
function lyric(c, t, o = {}) {
  const l = lineAt(t); if (!l) return;
  const { y = 968, size = 58, card = true, col = INK, dark = false } = o;
  const k = boilK(t), ws = l.text.split(/\s+/).filter(Boolean);
  const n = ws.reduce((a, w) => a + Math.max(2, w.length), 0), span = Math.max(0.35, (l.t1 - l.t0) * 0.85);
  const gap = size * 0.32, widths = ws.map(w => textW(w, size, '"Atma"', 600)), tot = widths.reduce((a, b) => a + b, 0) + gap * (ws.length - 1);
  const hold = Math.min(l.t1 + 0.7, (LINES[l.i + 1]?.t0 ?? 1e9) - 0.04), out = clamp((t - (hold - 0.25)) / 0.25);
  if (card) {
    const cw = tot + 110, ch = size * 1.6, sq = F(t) - F(l.t0) < 2 ? 0.92 + 0.04 * (F(t) - F(l.t0)) : 1;
    c.save(); c.translate(W / 2, y + out * 30); c.scale(sq, sq); c.globalAlpha = 1 - out;
    shape(c, spline([[-cw / 2, -ch / 2], [0, -ch / 2 - 6], [cw / 2, -ch / 2], [cw / 2 + 10, 0], [cw / 2, ch / 2], [0, ch / 2 + 5], [-cw / 2, ch / 2], [-cw / 2 - 10, 0]], true, 4), dark ? INK : C.cream, { w: 3, id: 7000 + l.i, k, reg: 3, ic: dark ? C.cream : INK });
    c.restore();
  }
  let acc = 0, x = W / 2 - tot / 2;
  ws.forEach((w, j) => {
    const at = l.t0 + acc / n * span; acc += Math.max(2, w.length);
    const df = F(t) - F(at);
    if (df >= 0) {
      const pop = df === 0 ? 1.18 : df === 1 ? 1.06 : 1;
      c.save(); c.globalAlpha = 1 - out; c.translate(x + widths[j] / 2, y + out * 30); c.scale(pop, pop);
      const hot = /যাওয়া|জায়গা|বিকেল|কথা|আমরা|তুমি|বাড়ি|জানালা|সম্ভাবনা|সুন্দর|পথে|পথেও|সত্যি|আবার|সময়/.test(w);
      letter(c, w, 0, 0, { size, col: dark ? C.cream : hot ? C.red : col, k, id: 7100 + l.i * 20 + j, weight: 600 });
      c.restore();
    }
    x += widths[j] + gap;
  });
}

// ------------------------------------------------------------------ scenes
const SC = {};
// OPEN — hook: a match is struck on a rooftop at dusk (smear on 1s), the flame lights a small paper lantern of memory
SC.open = (c, t) => {
  const k = boilK(t), q = on2(t);
  bands(c, [0, 640, 760], ['#F4CE7E', '#EFB66A', '#E9A35E']);
  sun(c, 1360, 690, 150, k, C.red);
  skyline(c, 760, k, t);
  rooftop(c, t, k);
  // the hook (0–0.5 s): a phone screen lights up in close-up — a photo of the place, the camera pulls back on 2s
  const pull = eOut(clamp(q / 3.2));
  const ph = [lerp(960, 1520, pull), lerp(560, 760, pull)], s = lerp(2.4, 0.42, pull);
  phone(c, ph[0], ph[1], s, t, k, 'place', 0.0);
  if (t > 3.2) { ami(c, 1460, 930, 1.05, t, k, { aR: 0.9, eR: 1.4, look: 0.6, blink: F(t) % 96 < 3 }, { id: 100 }); }
  if (t > 6) titleCard(c, t, 6);
};
function titleCard(c, t, ta) {
  const k = boilK(t, 3), u = eBack(clamp((on2(t) - ta) / 0.6)), out = clamp((t - (L(0).t0 - 1.2)) / 0.4);
  if (u <= 0 || out >= 1) return;
  c.save(); c.translate(560, 330); c.scale(u, u); c.rotate(-3 * DEG); c.globalAlpha = 1 - out;
  letter(c, 'আমাদের আর', 0, -70, { size: 92, font: '"Galada"', weight: 400, col: INK, k, id: 8100 });
  letter(c, 'যাওয়া হলো না', 30, 40, { size: 118, font: '"Galada"', weight: 400, col: C.red, k, id: 8101 });
  ink(c, spline([[-260, 120], [-60, 132], [160, 118], [300, 128]], false, 6), 6, { id: 8102, k });
  c.restore();
}
function skyline(c, y, k, t, col = '#E2C48E') {
  const pts = [[-10, y + 10]];
  let x = -10; for (let i = 0; x < 1940; i++) { const w = 70 + 90 * hash(51, i), h = 60 + 150 * hash(52, i); pts.push([x, y - h], [x + w, y - h]); x += w + 4; }
  pts.push([1940, y + 10]);
  shape(c, pts, col, { w: 3, id: 1200, k, reg: 2 });
  for (let i = 0; i < 60; i++) { const wx = hash(53, i) * W, wy = y - 20 - hash(54, i) * 120; if (hash(55, i) > 0.4) { c.fillStyle = C.yellow; c.fillRect(wx, wy, 10, 14); } }
}
function rooftop(c, t, k) {
  shape(c, [[-20, 800], [1940, 800], [1940, 1100], [-20, 1100]], '#D7B98A', { w: 3.4, id: 1300, k, reg: 2 });
  shape(c, [[-20, 760], [1940, 760], [1940, 806], [-20, 806]], '#C9A274', { w: 3.4, id: 1301, k, reg: 2 });
  for (let i = 0; i < 12; i++) ink(c, [[i * 170 + 30, 760], [i * 170 + 30, 806]], 2.4, { id: 1310 + i, k });
  // water tank + clothesline with a red saree and a yellow gamchha fluttering on 2s
  shape(c, rrect(180, 548, 380, 760, 30), '#8E8270', { w: 3.6, id: 1320, k });
  for (let i = 0; i < 4; i++) ink(c, [[186, 590 + i * 44], [374, 590 + i * 44]], 2.4, { id: 1324 + i, k });
  shape(c, rrect(240, 528, 320, 552, 8), '#6E6252', { w: 3, id: 1328, k });
  ink(c, [[420, 520], [1100, 560]], 2.4, { id: 1321, k });
  const fl = Math.floor(on2(t) * 2) % 2;
  shape(c, [[520, 528], [660, 536], [652 + fl * 8, 680], [528 - fl * 6, 690]], C.red, { w: 3, id: 1322, k });
  shape(c, [[760, 541], [860, 546], [856 - fl * 6, 640], [764, 636]], C.yellow, { w: 3, id: 1323, k });
  for (let i = 0; i < 3; i++) crow(c, 1500 + i * 70 + (on2(t) * 30) % 200, 220 + i * 26, 1, t, k, 1330 + i);
  // potted plant
  shape(c, [[1720, 806], [1800, 806], [1790, 760], [1730, 760]], C.red, { w: 3, id: 1340, k });
  for (let i = 0; i < 5; i++) shape(c, ellipsePts(1760 + (i - 2) * 16, 730 - (i % 2) * 18, 14, 26, 10, i), '#7C8A3C', { w: 2.4, id: 1341 + i, k });
}
// phone with a photo of a place in it (postcards are tiny drawn scenes)
function phone(c, x, y, s, t, k, which = 'place', flip = 0) {
  c.save(); c.translate(x, y); c.scale(s, s);
  shape(c, rrect(-116, -200, 116, 200, 26), INK, { w: 3.4, id: 1400, k, reg: 2 });
  c.save(); c.beginPath(); c.rect(-100, -180, 200, 360); c.clip();
  c.fillStyle = '#F6D27A'; c.fillRect(-100, -180, 200, 360);
  postcard(c, which, 0, 0, 200 / 1920, t, k);
  c.restore(); c.restore();
}
function postcard(c, which, x, y, sc, t, k) {      // a miniature drawn scene (the places on her phone)
