<script type="module">
// 40-business-ideas — «৳২০,০০০-এর কমে ৫টা ব্যবসা» (9:16, ~65 s). A countdown explainer starring the client's own

const L = [0, 5.94, 11.26, 21.10, 31.54, 39.88, 47.44, 55.76, 64.34, 67.12];        // scene starts in the client's VO (s)
const OFF = 0.3, GAP = 0.84;                                   // VO starts at 0.3 s; the VO's own pause before #1 is the freeze
const ST = L.map((v) => OFF + v);                             // scene starts in film time
const DUR = ST[9] + 1.6;
window.DEMO = { width: W, height: H, fps: FPS, duration: DUR };
const cv = document.getElementById('c'), X = cv.getContext('2d');
const loadImg = (s) => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(s); i.src = s; });
const META = await (await fetch(D + 'assets/rafi/meta.json')).json();
const SPR = {};
for (const k of Object.keys(META)) SPR[k] = await loadImg(D + 'assets/rafi/' + k + '.png');
for (const w of [500, 700, 800]) await document.fonts.load(`${w} 60px Anek`, '৳২০,০০০ ব্যবসা নম্বর ১২৩৪৫ AI');
await document.fonts.ready;

// ---------------------------------------------------------------- palette + helpers
const GREEN = '#17A35B', GREEN_D = '#0E7A43', GOLD = '#F4B400', GOLD_D = '#C98A00', INK = '#1B1F2A', CREAM = '#FFF8EC', SKY1 = '#8FD3FF', SKY2 = '#DDF3FF', RED = '#E8473C', BLUE = '#2F7DE1';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lerp = (a, b, u) => a + (b - a) * u, seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = (x) => 1 - Math.pow(1 - clamp(x), 3), eIn = (x) => Math.pow(clamp(x), 3), eIO = (x) => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eBack = (x, s = 1.7) => { x = clamp(x); const c3 = s + 1; return 1 + c3 * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };

const hash = (i, j = 0) => { const s = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return s - Math.floor(s); };
function rr(c, x, y, w, h, r, fill, stroke, lw = 6) { c.beginPath(); c.roundRect(x, y, w, h, r); if (fill) { c.fillStyle = fill; c.fill(); } if (stroke) { c.lineWidth = lw; c.strokeStyle = stroke; c.stroke(); } }
function txt(c, s, x, y, { size = 60, w = 800, col = INK, align = 'center', a = 1, stroke, sw = 12 } = {}) {
  c.save(); c.globalAlpha *= a; c.font = `${w} ${size}px Anek`; c.textAlign = align; c.textBaseline = 'middle';
  if (stroke) { c.lineJoin = 'round'; c.lineWidth = sw; c.strokeStyle = stroke; c.strokeText(s, x, y); }
  c.fillStyle = col; c.fillText(s, x, y); c.restore();
}
// the character: frame of a pose, feet at (x, y), height in px
function rafi(c, pose, i, x, y, h, { flip = false, a = 1, rot = 0 } = {}) {
  const k = pose + (((i % 8) + 8) % 8), m = META[k], s = h / 470;
  c.save(); c.globalAlpha *= a; c.translate(x, y); c.rotate(rot); if (flip) c.scale(-1, 1);
  c.fillStyle = 'rgba(0,0,0,0.18)'; c.beginPath(); c.ellipse(0, 0, m.w * s * 0.42, 16 * s, 0, 0, 7); c.fill();
  c.drawImage(SPR[k], -m.fx * s, -m.h * s, m.w * s, m.h * s); c.restore();
}
const cyc = (t, fps) => Math.floor(t * fps);
// a talking loop on the presenting atlas: rests on frame 0/7, gestures through 1-5
const talk = (t, speed = 5) => [0, 1, 2, 3, 4, 5, 6, 7, 6, 5, 4, 3, 2, 1][cyc(t, speed) % 14];

// ---------------------------------------------------------------- the world
function sky(c, top = SKY1, bot = SKY2) { const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, top); g.addColorStop(1, bot); c.fillStyle = g; c.fillRect(0, 0, W, H); }
function cloud(c, x, y, s) { c.fillStyle = '#FFFFFF'; for (const [dx, dy, r] of [[0, 0, 60], [60, -20, 70], [130, 0, 55], [65, 20, 60]]) { c.beginPath(); c.arc(x + dx * s, y + dy * s, r * s, 0, 7); c.fill(); } }
const BLD = [['#F6C28B', 320], ['#9AD1C9', 440], ['#F49E9E', 360], ['#C9B6F2', 500], ['#F7DC86', 380], ['#A8D58A', 420], ['#F6C28B', 340]];
function city(c, t, gy = 1460, scroll = 0) {
  sky(c); cloud(c, 140 + (t * 12) % 1300 - 200, 380, 0.9); cloud(c, 700 - (t * 8) % 1300, 520, 0.7);
  let x = -((scroll % 1260) + 1260) % 1260 - 80;
  for (let k = 0; k < 14; k++) {
    const [col, h] = BLD[k % BLD.length], w = 180;
    rr(c, x, gy - h, w, h + 10, 10, col);
    c.fillStyle = 'rgba(255,255,255,0.55)'; for (let r = 0; r < Math.floor(h / 90); r++) for (let q = 0; q < 2; q++) c.fillRect(x + 30 + q * 72, gy - h + 34 + r * 90, 48, 50);

  c.fillStyle = '#5B6472'; c.fillRect(0, gy, W, H - gy); c.fillStyle = '#8C95A3'; c.fillRect(0, gy, W, 26);
  c.fillStyle = '#F4F4F4'; for (let i = 0; i < 8; i++) c.fillRect(((i * 200 - scroll * 1.5) % 1400 + 1400) % 1400 - 160, gy + 170, 110, 14);
}
function rickshaw(c, x, y, s = 1, t = 0) {

  for (const wx of [-90, 70]) { c.strokeStyle = INK; c.lineWidth = 8; c.beginPath(); c.arc(wx, -50, 48, 0, 7); c.stroke(); for (let k = 0; k < 6; k++) { const a = t * 6 + k; c.lineWidth = 3; c.beginPath(); c.moveTo(wx, -50); c.lineTo(wx + Math.cos(a) * 46, -50 + Math.sin(a) * 46); c.stroke(); } }
  rr(c, 10, -230, 140, 150, 30, '#E8473C'); rr(c, 0, -250, 170, 40, 20, '#2F7DE1'); c.fillStyle = '#F4B400'; for (let k = 0; k < 4; k++) c.fillRect(20 + k * 34, -205, 22, 100);
  c.strokeStyle = INK; c.lineWidth = 8; c.beginPath(); c.moveTo(-90, -50); c.lineTo(70, -50); c.lineTo(80, -100); c.moveTo(-90, -50); c.lineTo(-160, -150); c.stroke(); rr(c, -180, -165, 50, 16, 8, INK);
  c.restore();
}
const SHOPS = [['কাপড়', '#E8473C', '👕'], ['রেস্টুরেন্ট', '#F08A24', '🍛'], ['সেলুন', '#9B59B6', '✂️'], ['ফার্মেসি', '#17A35B', '💊'], ['টিউশন', '#2F7DE1', '📚']];
function shop(c, x, y, s, k, { glow = 0 } = {}) {
  const [name, col] = SHOPS[k % SHOPS.length];
  c.save(); c.translate(x, y); c.scale(s, s);
  if (glow > 0) { const g = c.createRadialGradient(0, -110, 10, 0, -110, 220); g.addColorStop(0, `rgba(255,214,90,${0.7 * glow})`); g.addColorStop(1, 'rgba(255,214,90,0)'); c.fillStyle = g; c.fillRect(-230, -330, 460, 440); }
  rr(c, -95, -190, 190, 190, 12, '#FFF8EC', INK, 6); rr(c, -60, -95, 52, 95, 6, '#8C6B4A'); rr(c, 8, -105, 62, 54, 6, '#BFE6FF', INK, 4);
  for (let i = 0; i < 5; i++) { c.fillStyle = i % 2 ? '#FFFFFF' : col; c.beginPath(); c.moveTo(-105 + i * 42, -190); c.lineTo(-63 + i * 42, -190); c.lineTo(-63 + i * 42, -150); c.arc(-84 + i * 42, -150, 21, 0, Math.PI); c.fill(); }
  rr(c, -100, -250, 200, 62, 12, col, INK, 6); txt(c, name, 0, -219, { size: 36, col: '#FFFFFF', w: 800 });
  c.restore();
}
function taka(c, x, y, s, rot = 0, a = 1) {
  c.save(); c.globalAlpha *= a; c.translate(x, y); c.rotate(rot); c.scale(s, s);
  rr(c, -110, -55, 220, 110, 12, '#7BC98F', GREEN_D, 5); rr(c, -92, -40, 184, 80, 8, null, 'rgba(14,122,67,0.6)', 3);
  c.fillStyle = GREEN_D; c.beginPath(); c.arc(0, 0, 30, 0, 7); c.fill(); txt(c, '৳', 0, 2, { size: 48, col: '#E9FFF0' }); c.restore();
}
function bundle(c, x, y, s, shake = 0) {
  c.save(); c.translate(x + Math.sin(shake * 60) * 8 * shake, y); c.scale(s, s);
  for (let i = 5; i >= 0; i--) taka(c, i * 3, -i * 12, 1.25, 0);
  rr(c, -24, -110, 48, 130, 6, '#F4B400', GOLD_D, 4); txt(c, '২০,০০০', 0, -150, { size: 46, col: GREEN_D, stroke: '#FFFFFF', sw: 10 });
  c.restore();
}
function boat(c, x, y, s, sink, rot = 0, label = true) {
  c.save(); c.translate(x, y + sink * 120 * s); c.rotate(rot + sink * 0.5); c.scale(s, s);
  c.fillStyle = '#FFFFFF'; c.strokeStyle = INK; c.lineWidth = 6; c.beginPath(); c.moveTo(-150, -30); c.lineTo(150, -30); c.lineTo(100, 40); c.lineTo(-100, 40); c.closePath(); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(0, -30); c.lineTo(0, -170); c.lineTo(110, -40); c.closePath(); c.fill(); c.stroke();
  if (label) txt(c, 'ভুল', -50, 4, { size: 40, col: RED });
  c.restore();
}
function water(c, y, t) { c.fillStyle = '#5DB8F0'; c.fillRect(0, y, W, H - y); c.strokeStyle = 'rgba(255,255,255,0.7)'; c.lineWidth = 6; for (let r = 0; r < 4; r++) { c.beginPath(); for (let x = -20; x <= W + 20; x += 20) c.lineTo(x, y + 30 + r * 70 + Math.sin(x * 0.02 + t * 3 + r) * 10); c.stroke(); } }
function lock(c, x, y, s, open = 0) {
  c.save(); c.translate(x, y); c.scale(s, s); c.strokeStyle = '#8A8F99'; c.lineWidth = 22; c.beginPath(); c.arc(0, -60 - open * 50, 62, Math.PI, 0); c.lineTo(62, -60 + (open > 0.5 ? -50 : 0)); c.stroke();
  rr(c, -95, -70, 190, 150, 24, GOLD, GOLD_D, 6); c.fillStyle = INK; c.beginPath(); c.arc(0, -8, 18, 0, 7); c.fill(); c.fillRect(-8, -8, 16, 50); c.restore();
}
function phone(c, x, y, s, inner) { c.save(); c.translate(x, y); c.scale(s, s); rr(c, -110, -200, 220, 400, 34, INK); rr(c, -96, -182, 192, 364, 22, '#FFFFFF'); c.beginPath(); c.roundRect(-96, -182, 192, 364, 22); c.clip(); if (inner) inner(c); c.restore(); }
function heartIcon(c, x, y, s, col = RED) { c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = col; c.beginPath(); c.moveTo(0, 12); c.bezierCurveTo(-34, -12, -18, -38, 0, -20); c.bezierCurveTo(18, -38, 34, -12, 0, 12); c.fill(); c.restore(); }
function check(c, x, y, s, k) { if (k <= 0) return; c.save(); c.translate(x, y); c.scale(s * eBack(k), s * eBack(k)); c.fillStyle = GREEN; c.beginPath(); c.arc(0, 0, 70, 0, 7); c.fill(); c.strokeStyle = '#FFFFFF'; c.lineWidth = 18; c.lineCap = 'round'; c.beginPath(); c.moveTo(-32, 2); c.lineTo(-8, 28); c.lineTo(36, -26); c.stroke(); c.restore(); }
function confetti(c, t, t0, n = 90) { const a = t - t0; if (a < 0 || a > 4) return; for (let i = 0; i < n; i++) { const x = W / 2 + (hash(i, 1) - 0.5) * 300 + (hash(i, 2) - 0.5) * 1400 * eOut(a / 1.2), y = 700 - 500 * eOut(a / 0.8) * hash(i, 3) + 900 * a * a * 0.25 * (0.5 + hash(i, 4)); c.save(); c.translate(x, y); c.rotate(a * 8 * (hash(i, 5) - 0.5)); c.globalAlpha = 1 - seg(a, 3, 4); c.fillStyle = [GOLD, GREEN, RED, BLUE, '#FFFFFF'][i % 5]; c.fillRect(-9, -5, 18, 10); c.restore(); } }
// the big countdown number dropping in, with a dust ring on landing
function bigNum(c, s, t, t0, { col = GREEN, y = 640, size = 420 } = {}) {
  const a = t - t0; if (a < 0) return;
  const k = bounce(clamp(a / 0.55)), yy = lerp(-300, y, k), sc = 1 + 0.12 * Math.exp(-a * 6) * Math.sin(a * 30);
  if (a > 0.3 && a < 1.1) { c.save(); c.globalAlpha = 1 - seg(a, 0.3, 1.1); c.strokeStyle = col; c.lineWidth = 10; c.beginPath(); c.ellipse(W / 2, y + size * 0.42, 120 + (a - 0.3) * 500, 30 + (a - 0.3) * 60, 0, 0, 7); c.stroke(); c.restore(); }

  if (m >= 1) return;
  c.save(); c.translate(lerp(W / 2, trackX(slot), m), lerp(yy, TRACK_Y, m)); c.scale(sc * lerp(1, 0.16, m), sc * lerp(1, 0.16, m)); txt(c, s, 0, 0, { size, col, stroke: '#FFFFFF', sw: 26 }); c.restore();
}
// the countdown tracker: ৫ ৪ ৩ ২ ১ — each slot fills when its number lands; #১ stays a gold '?' until it is revealed
const TRACK = ['৫', '৪', '৩', '২', '১'], TRACK_Y = 470, trackX = (k) => W / 2 + (k - 2) * 112;
function tracker(c, t) {
  if (t < ST[0] + 0.6 || t > ST[8] + 0.5) return;

  TRACK.forEach((d, k) => {
    const t0 = ST[k + 2] + 1.8, done = t >= t0, cur = t >= ST[k + 2] && t < (k < 4 ? ST[k + 3] : ST[7]), gold = k === 4;
    const x = trackX(k), pop = done ? 1 + 0.25 * Math.exp(-(t - t0) * 8) : 1;
    c.save(); c.globalAlpha = a; c.translate(x, TRACK_Y); c.scale(pop, pop);
    rr(c, -46, -40, 92, 80, 22, done ? (gold ? GOLD : GREEN) : 'rgba(255,255,255,0.92)', cur ? (gold ? GOLD_D : GREEN_D) : 'rgba(27,31,42,0.25)', cur ? 7 : 4);
    txt(c, done || !gold ? d : '?', 0, 3, { size: 52, col: done ? '#FFFFFF' : (gold ? GOLD_D : 'rgba(27,31,42,0.45)') });
    c.restore();
  });
}
// the info card for each idea: who buys, the first three steps, the main risk (from the brief)
const INFO = [
  { who: 'স্কুল-ছাত্রছাত্রীর অভিভাবক', steps: ['জানা বিষয় ও ক্লাস বাছুন', '২০ জন অভিভাবককে জানান', '১টা ক্লাস ফ্রি দিন'], risk: 'পরীক্ষার মৌসুম-নির্ভর, প্রতিযোগিতা বেশি' },
  { who: 'ফ্ল্যাটের মালিক, গিফট ক্রেতা, অফিস', steps: ['৩০–৫০টা সহজ গাছ দিয়ে শুরু', 'গাছের যত্নের রিলস বানান', 'গিফট সেট বিক্রি করুন'], risk: 'গরম-বৃষ্টিতে গাছ মরে, ডেলিভারিতে ক্ষতি' },
  { who: 'অফিসকর্মী, ছাত্র, ব্যাচেলর', steps: ['১০ জনকে ১ সপ্তাহ টেস্ট মেনু', 'রোজ একই সময়ে ডেলিভারি', 'মাসিক প্ল্যান অফার করুন'], risk: 'খাবারের মান ও পরিচ্ছন্নতা, রোজকার খাটুনি' },
  { who: 'ফেসবুক-ইনস্টাগ্রামের ক্রেতা', steps: ['একটা নিশ বাছুন', 'স্যাম্পল দেখিয়ে অগ্রিম অর্ডার', 'যা অর্ডার, শুধু তাই কিনুন'], risk: 'সাপ্লায়ারের দেরি, রিটার্ন, ফেক অর্ডার' },
  { who: 'কাপড়ের দোকান, রেস্টুরেন্ট, সেলুন, ফার্মেসি', steps: ['১টা দোকানের জন্য ১০টা ফ্রি পোস্ট', 'মাসিক প্যাকেজ বিক্রি করুন', 'রিভিউ/টেস্টিমোনিয়াল নিন'], risk: 'AI-এর লেখা এডিট না করলে মান খারাপ' },
];
const CARD_T = [[16.2, 21.0], [25.54, 31.4], [35.54, 39.8], [43.18, 46.55], [52.9, 55.7]].map(([a, b]) => [OFF + a, OFF + b]);
function infoCard(c, t) {

// the label card at the top: '#৫ হোম টিউশন' + a cost chip

  c.font = '800 76px Anek'; const tw = c.measureText(title).width; rr(c, -tw / 2 - 40, -62, tw + 80, 124, 30, col); txt(c, title, 0, 4, { size: 76, col: '#FFFFFF' });

  c.restore();
}

// ---------------------------------------------------------------- scenes (lt = time in scene)
const SC = [];
