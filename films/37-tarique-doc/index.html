// 37-tarique-doc — «শুভ জন্মদিন» a one-minute documentary tribute (vintage-history look from the client's reference):
// dark grunge paper with faint handwriting, archive photos on floating glass plates in depth, gold serif headings with a
// white line under them, dust, scratches, flicker and warm light leaks. The past is sepia; the present warms into colour.

const W = 1920, H = 1080, FPS = 30, OFF = 1.2, DUR = 61.2, D = '/demos/37-tarique-doc/';

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - clamp(x), 3), eIn = x => Math.pow(clamp(x), 3), eIO = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const rnd = s => { s = (s * 2654435761) >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };

// ------------------------------------------------------------------ the film: one scene per narrated line

const SC = [
  { v: 0.00, side: 'L', ttl: '২০ নভেম্বর, ১৯৬৫', sub: 'একটা সকাল।', panes: [['p41S', 400, -40, 0, -16, 560], ['p33S', 60, 140, -360, -8, 520]] },

];
SC.forEach((s, i) => { s.t0 = i ? s.v + OFF : 0; });
SC.forEach((s, i) => { s.t1 = i + 1 < SC.length ? SC[i + 1].t0 : DUR; });

// ------------------------------------------------------------------ build the DOM
const loadImg = s => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(s); i.src = s; });
const world = document.getElementById('world'), texts = document.getElementById('texts');
const els = [];
for (const s of SC) {
  s.els = [];
  if (s.panes) for (let [p, x, y, z, ry, w] of s.panes) {
    const d = document.createElement('div'); d.className = 'pane'; w = Math.round(w * 1.2); d.style.width = w + 'px';
    const im = await loadImg(D + 'assets/photos/' + p + '.jpg'); d.appendChild(im);
    const g = document.createElement('div'); g.className = 'gl'; d.appendChild(g);
    world.appendChild(d); const h = w * im.naturalHeight / im.naturalWidth + 32;
    s.els.push({ d, g, x: x * 1.08, y: y + 50, z, ry, w: w + 32, h });
  }
  if (s.cut) {
    const gl = document.createElement('div'); gl.className = 'glow'; world.appendChild(gl);
    const d = document.createElement('div'); d.className = 'cut'; d.style.height = s.cut[1] + 'px';
    const im = await loadImg(D + 'assets/photos/p28C.png'); d.appendChild(im); world.appendChild(d);
    s.cutEl = { d, gl, x: s.cut[0], h: s.cut[1], w: s.cut[1] * im.naturalWidth / im.naturalHeight };
  }
  const t = document.createElement('div'); t.className = 'txt ' + s.side;
  t.innerHTML = `<div class="ttl">${s.ttl}</div><div class="rule"></div><div class="sub">${s.sub}</div>`;
  if (s.end) { t.querySelector('.ttl').style.fontSize = '180px'; t.querySelector('.sub').style.fontSize = '50px'; }
  texts.appendChild(t); s.txt = t; s.ttlEl = t.querySelector('.ttl'); s.subEl = t.querySelector('.sub'); s.ruleEl = t.querySelector('.rule');
}
// glass shards drifting in the deep background
const SH = [];
{ const r = rnd(11);
  for (let i = 0; i < 9; i++) {
    const d = document.createElement('div'); d.className = 'shard';
    const w = 300 + r() * 500, h = 300 + r() * 600; d.style.width = w + 'px'; d.style.height = h + 'px';
    const pts = []; const n = 3 + (r() * 3 | 0); for (let k = 0; k < n; k++) { const a = k / n * 6.283 + r() * .8; pts.push(`${50 + 50 * Math.cos(a)}% ${50 + 50 * Math.sin(a)}%`); }
    d.style.clipPath = `polygon(${pts.join(',')})`; world.prepend(d);
    SH.push({ d, x: (r() - .5) * 2600, y: (r() - .5) * 1300, z: -900 - r() * 900, rx: r() * 40 - 20, ry: r() * 70 - 35, rz: r() * 360, sp: .4 + r(), w, h });
  } }

await document.fonts.load('700 80px Serif', 'শুভ জন্মদিন'); await document.fonts.load('500 40px Hind', 'শুভ জন্মদিন'); await document.fonts.load('40px Galada', 'শুভ জন্মদিন');
await document.fonts.ready;

// handwriting: lines of the narration in a hand script, faint ink on the paper
{ const c = document.getElementById('hand').getContext('2d'); const r = rnd(5);
  const L = ['একটা সকাল, বিশে নভেম্বর', 'এক কাপ চা আর হালকা আড্ডা', 'পেছনে তাকালে দীর্ঘ সংগ্রামের স্মৃতি', 'সামনে বাংলাদেশের ভবিষ্যৎ', 'এগিয়ে যাচ্ছে বাংলাদেশ',

  for (let k = 0; k < 4; k++) {               // four "pages", each a slightly rotated block of lines
    c.save(); c.translate(200 + (k % 2) * 1150 + r() * 120, 120 + (k >> 1) * 650 + r() * 60); c.rotate((r() - .5) * .12);
    for (let i = 0; i < 9; i++) {
      c.font = `${38 + r() * 18 | 0}px Galada`; c.fillStyle = `rgba(232,208,160,${.05 + r() * .05})`;
      c.fillText(L[(k * 5 + i) % L.length] + (r() < .5 ? ' — ' + L[(i * 3 + k) % L.length] : ''), r() * 60, i * 66);
      c.strokeStyle = 'rgba(232,208,160,.03)'; c.beginPath(); c.moveTo(0, i * 66 + 14); c.lineTo(1000, i * 66 + 14); c.stroke();
    }
    c.restore();
  } }

// ------------------------------------------------------------------ per-frame
const paper = document.getElementById('paper'), hand = document.getElementById('hand');
const fx = document.getElementById('fx').getContext('2d');
const tf = (x, y, z, rx, ry, rz = 0, s = 1) => `translate(-50%,-50%) translate3d(${x}px,${y}px,${z}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})`;

function frameScene(s, t) {
  const show = t > s.t0 - .05 && t < s.t1 + .75;
  const inU = seg(t, s.t0, s.t1), life = t - s.t0, outU = seg(t, s.t1 - .15, s.t1 + .7);
  s.els.forEach((e, k) => {
    if (!show) { e.d.style.display = 'none'; return; }
    const a = eOut(seg(life, k * .16, k * .16 + .9));                    // arrive from depth, staggered
    const z = e.z - (1 - a) * 1100 + inU * 140 + eIn(outU) * 900;        // slow dolly, then fly past
    const x = e.x + (1 - a) * (e.x > 0 ? 260 : -260) + inU * (e.x > 0 ? -30 : 30);
    const ry = e.ry + (1 - a) * (e.ry < 0 ? -28 : 28) + inU * (e.ry < 0 ? 4 : -4);
    e.d.style.display = 'block';
    e.d.style.opacity = (a * (1 - eOut(seg(outU, .1, .8)))).toFixed(3);
    e.d.style.transform = tf(x, e.y + Math.sin(t * .7 + k) * 6, z, 2 * Math.sin(t * .5 + k), ry);
    e.g.style.backgroundPosition = `${lerp(110, -10, seg(life, k * .16 + .3, k * .16 + 1.8))}% 0`;
  });
  if (s.cutEl) {
    const c = s.cutEl, a = eOut(seg(life, 0, 1.1)), o = show ? a * (1 - eOut(seg(outU, 0, .6))) : 0;
    c.d.style.display = c.gl.style.display = o > 0 ? 'block' : 'none';
    const y = 70 + (1 - a) * 160 - inU * 30, z = -60 + inU * 120 + eIn(outU) * 500;
    c.d.style.opacity = o.toFixed(3); c.d.style.transform = tf(c.x, y, z, 0, (s.end ? 8 : -8) * (1 - a));
    c.gl.style.opacity = (o * (.75 + .25 * Math.sin(t * 2))).toFixed(3); c.gl.style.transform = `translate3d(${c.x}px,${-40}px,${z - 300}px) scale(${1 + .05 * Math.sin(t)})`;
  }
  // text: gold title tracks in from a blur, the rule draws, the white line rises
  const ta = seg(life, .25, 1.05), sa = seg(life, .7, 1.4), out = s.end ? seg(t, DUR - 1.2, DUR - .2) : seg(t, s.t1 - .35, s.t1 + .1);
  const vis = show && t < s.t1 + .2;
  s.txt.style.opacity = vis ? (1 - out).toFixed(3) : 0;
  if (vis) {
    const top = s.end ? 300 : (s.ttl.length > 18 ? 600 : 640);
    s.txt.style.top = top + 'px';
    s.ttlEl.style.opacity = eOut(ta).toFixed(3);
    s.ttlEl.style.transform = `translateX(${(s.side === 'L' ? -1 : 1) * (1 - eOut(ta)) * -60}px) scale(${lerp(1.06, 1, eOut(ta)) + inU * .03})`;
    s.ttlEl.style.transformOrigin = s.side === 'L' ? 'left center' : 'right center';
    s.ttlEl.style.letterSpacing = `${(1 - eOut(ta)) * 18}px`;
    s.ruleEl.style.width = (240 * eOut(seg(life, .5, 1.3))) + 'px';
    s.subEl.style.opacity = eOut(sa).toFixed(3); s.subEl.style.transform = `translateY(${(1 - eOut(sa)) * 24}px)`;
  }
}

const CAPS = [[0.00, 0.92, 'একটা সকাল।'], [1.51, 3.66, '২০ নভেম্বর, ১৯৬৫।'], [4.42, 6.37, 'একটা ইতিহাসকে বদলে দেওয়া ক্ষণ।'],
